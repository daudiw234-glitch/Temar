<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мифутка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Unbounded:wght@800;900&display=swap">
<style>
  /* Layout: one 9:16 frame of soft-lit flat vector art with neon accents; subtitles low-center. Single dark look by choice. */
  :root { --bg: #0b0912; --hl: #ffd84d; --f-ui: "Montserrat", system-ui, sans-serif; --f-big: "Unbounded", "Montserrat", sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: #fff; display: grid; place-items: center; overflow: hidden; }
  .frame { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; overflow: hidden; container-type: inline-size; background: #000; }
  .frame svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .subs { position: absolute; left: 7cqw; right: 7cqw; top: 130cqw; text-align: center; font: 800 5.8cqw/1.25 var(--f-ui); color: #fff;
          text-shadow: 0 .3cqw 0 rgba(0,0,0,.6), 0 0 2.4cqw rgba(0,0,0,.7); text-wrap: balance; }
  .subs span.on { color: var(--hl); }
  .subs span.in { display: inline-block; animation: subIn .22s cubic-bezier(.3,1.8,.5,1) both; }
  @keyframes subIn { from { transform: translateY(2cqw) scale(.6); opacity: 0; } }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .3s ease-out; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }

  .chip { position: absolute; left: 50%; transform: translateX(-50%) scale(.6); opacity: 0; white-space: nowrap; transition: opacity .2s, transform .25s cubic-bezier(.3,1.7,.5,1); }
  .chip.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .day { top: 20cqw; font: 900 9cqw var(--f-big); color: #fff; background: #ff3b6b; padding: 2cqw 5cqw; border-radius: 3cqw; box-shadow: 0 1.4cqw 0 #8f1239; }
  .mini { top: 38cqw; display: flex; align-items: center; gap: 2.6cqw; background: rgba(20,16,32,.88); border: .3cqw solid rgba(255,255,255,.25);
          padding: 2.4cqw 4cqw 2.4cqw 2.6cqw; border-radius: 99cqw; font: 800 3.8cqw var(--f-ui); }
  .mini i { width: 7cqw; height: 7cqw; border-radius: 50%; background: #ff3b6b; display: grid; place-items: center; font-style: normal; font-size: 3cqw; }
  .big { top: 30cqw; font: 900 13cqw/1 var(--f-big); text-align: center; color: #fff;
         text-shadow: 0 0 3cqw #ff3bd4, 0 0 6cqw #ff3bd4, .8cqw .8cqw 0 #3a0b4a; }
  .big.shake { animation: bigShake .12s linear infinite; }
  @keyframes bigShake { 25% { translate: 1cqw -.6cqw; } 50% { translate: -.8cqw .8cqw; } 75% { translate: .6cqw .6cqw; } }

  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw; background: rgba(11,9,18,.85); text-align: center; padding: 6cqw; }
  .start[hidden] { display: none !important; }
  .start h1 { font: 900 9cqw/1.1 var(--f-big); margin: 0; }
  .start p { font: 600 4.2cqw var(--f-ui); margin: 0; color: #c8bfe6; }
  .start button { font: 800 4.4cqw var(--f-ui); background: #ff3b6b; color: #fff; border: 0; padding: 3.4cqw 7cqw; border-radius: 99cqw; cursor: pointer; }
  .start button:focus-visible { outline: .8cqw solid #fff; outline-offset: 1cqw; }

  .scene { display: none; }
  svg[data-scene="street"] #sc-street, svg[data-scene="desk"] #sc-desk, svg[data-scene="pcs"] #sc-pcs, svg[data-scene="screen"] #sc-screen,
  svg[data-scene="listen"] #sc-listen, svg[data-scene="stairs"] #sc-stairs { display: inline; }
  #cam { transform-origin: 180px 320px; }
  .neon { animation: neon 2.4s steps(1) infinite; }
  @keyframes neon { 0%, 70%, 74%, 100% { opacity: 1; } 72% { opacity: .35; } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  .rain line { animation: rain .7s linear infinite; }
  @keyframes rain { from { transform: translateY(-40px); } to { transform: translateY(640px); } }
  .wave { animation: wave .8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .wave.b { animation-delay: .4s; }
  @keyframes wave { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .note { animation: note 1.6s ease-out infinite; }
  .note.b { animation-delay: .8s; }
  @keyframes note { from { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } to { transform: translate(30px,-90px); opacity: 0; } }
  .huh { display: none; } svg[data-huh="on"] .huh { display: inline; animation: pop .3s cubic-bezier(.3,1.7,.5,1); transform-box: fill-box; transform-origin: bottom center; }
  svg[data-huh="on"] #mikeHead { transform: rotate(-8deg); transform-box: fill-box; transform-origin: bottom center; transition: transform .25s; }
  @keyframes pop { from { transform: scale(0); } }
  .nick { opacity: 0; } svg[data-nick="on"] .nick { opacity: 1; animation: pop .35s cubic-bezier(.3,1.7,.5,1); transform-box: fill-box; transform-origin: center; }
  .laugh { display: none; } svg[data-laugh="on"] .laugh { display: inline; } svg[data-laugh="on"] .calm { display: none; }
  .mo { display: none; } svg[data-mo="1"][data-talk="mike"] #mike .mo { display: inline; }
  @media (prefers-reduced-motion: reduce) { .neon, .bob, .rain line, .wave, .note, .big.shake { animation: none; } }
</style>
</head>
<body>
<div class="frame" id="frame">
  <svg class="art" id="art" viewBox="0 0 360 640" data-scene="street" data-huh="off" data-nick="off" data-laugh="off" data-mo="0" data-talk="" role="img" aria-label="Мультик: в компьютерном клубе ИЗИ новый админ Мифутка, друзья находят его трек">
    <defs>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
      <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
      <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090a24"/><stop offset="1" stop-color="#26184a"/></linearGradient>
      <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120e24"/><stop offset="1" stop-color="#2a1a44"/></linearGradient>
      <linearGradient id="stairWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e2b4"/><stop offset="1" stop-color="#d9c08a"/></linearGradient>
      <linearGradient id="puffer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5236"/><stop offset="1" stop-color="#4a301e"/></linearGradient>
      <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#121216"/></linearGradient>
      <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4bb0"/><stop offset="1" stop-color="#3d2a70"/></linearGradient>
      <radialGradient id="skin" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffdcc4"/><stop offset="1" stop-color="#eab896"/></radialGradient>
      <linearGradient id="screenLight" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4fc3ff" stop-opacity=".45"/><stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/></linearGradient>
    </defs>

    <g id="cam">
      <!-- 1. street with the club's neon sign -->
      <g id="sc-street" class="scene">
        <rect width="360" height="640" fill="url(#nightSky)"/>
        <rect x="20" y="150" width="320" height="420" fill="#1b1430"/>
        <g fill="#2c2350"><rect x="44" y="330" width="40" height="50" rx="3"/><rect x="104" y="330" width="40" height="50" rx="3"/><rect x="216" y="330" width="40" height="50" rx="3"/><rect x="276" y="330" width="40" height="50" rx="3"/></g>
        <g fill="#ffcf6b" opacity=".8"><rect x="104" y="330" width="40" height="50" rx="3"/><rect x="276" y="330" width="40" height="50" rx="3"/></g>
        <rect x="140" y="440" width="80" height="130" rx="4" fill="#0e0a1c"/><rect x="146" y="446" width="68" height="124" fill="#5fd3ff" opacity=".25"/>
        <g class="neon" filter="url(#glow)">
          <rect x="40" y="190" width="280" height="110" rx="14" fill="none" stroke="#ff3bd4" stroke-width="4"/>
          <text x="180" y="226" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#7ff3ff">КОМПЬЮТЕРНЫЙ КЛУБ</text>
          <text x="180" y="284" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="54" fill="#ff5be0">ИЗИ</text>
        </g>
        <ellipse cx="180" cy="245" rx="170" ry="90" fill="#ff3bd4" opacity=".18" filter="url(#blur)"/>
        <rect y="570" width="360" height="70" fill="#141022"/>
        <ellipse cx="180" cy="600" rx="150" ry="16" fill="#ff3bd4" opacity=".25" filter="url(#blurS)"/>
        <g class="rain" stroke="#9fb4ff" stroke-width="1.2" opacity=".35">
          <line x1="30" y1="0" x2="26" y2="18"/><line x1="90" y1="-120" x2="86" y2="-102" style="animation-delay:-.2s"/><line x1="150" y1="-60" x2="146" y2="-42" style="animation-delay:-.4s"/>
          <line x1="210" y1="-200" x2="206" y2="-182" style="animation-delay:-.1s"/><line x1="270" y1="-30" x2="266" y2="-12" style="animation-delay:-.5s"/><line x1="330" y1="-150" x2="326" y2="-132" style="animation-delay:-.3s"/>
        </g>
      </g>

      <!-- 2. the admin desk -->
      <g id="sc-desk" class="scene">
        <rect width="360" height="640" fill="url(#room)"/>
        <circle cx="70" cy="200" r="90" fill="#7a3cff" opacity=".35" filter="url(#blur)"/>
        <circle cx="300" cy="230" r="90" fill="#22d3ee" opacity=".3" filter="url(#blur)"/>
        <g opacity=".8"><rect x="20" y="150" width="90" height="60" rx="4" fill="#0e0b1c" stroke="#3b2f66"/><rect x="250" y="150" width="90" height="60" rx="4" fill="#0e0b1c" stroke="#3b2f66"/>
          <rect x="26" y="156" width="78" height="48" fill="#3fd7ff" opacity=".25"/><rect x="256" y="156" width="78" height="48" fill="#ff5be0" opacity=".25"/></g>
        <g id="mike"></g>
        <g class="nick" filter="url(#glow)">
          <text x="180" y="130" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="38" fill="#ff5be0">MIFUTKA</text>
          <path d="M100 140 h160" stroke="#7ff3ff" stroke-width="3"/>
        </g>
        <g class="huh" fill="#ffd84d" filter="url(#glow)"><text x="268" y="196" font-family="Unbounded, sans-serif" font-weight="900" font-size="54">?</text></g>
        <rect y="520" width="360" height="120" fill="#1a1230"/>
        <rect y="516" width="360" height="8" fill="#ff3bd4" opacity=".8" filter="url(#glow)"/>
        <rect x="120" y="548" width="120" height="34" rx="8" fill="#0e0b1c" stroke="#7ff3ff" stroke-width="2"/>
        <text x="180" y="571" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#7ff3ff">АДМИН</text>
      </g>

      <!-- 3. the two of us at the PCs -->
      <g id="sc-pcs" class="scene">
        <rect width="360" height="640" fill="url(#room)"/>
        <circle cx="180" cy="300" r="160" fill="#3a2a7a" opacity=".5" filter="url(#blur)"/>
        <g id="duoPcs"></g>
        <rect y="470" width="360" height="200" fill="url(#screenLight)"/>
        <rect x="20" y="500" width="150" height="110" rx="6" fill="#0c0a16" stroke="#3b2f66" stroke-width="3"/>
        <rect x="190" y="500" width="150" height="110" rx="6" fill="#0c0a16" stroke="#3b2f66" stroke-width="3"/>
        <rect x="0" y="600" width="360" height="40" fill="#0c0a16"/>
        <g fill="#7ff3ff" opacity=".5"><rect x="40" y="612" width="110" height="6" rx="3"/><rect x="210" y="612" width="110" height="6" rx="3"/></g>
      </g>

      <!-- 4. the channel page on the monitor -->
      <g id="sc-screen" class="scene">
        <rect width="360" height="640" fill="#07060d"/>
        <g transform="translate(0 -70)">
        <rect x="18" y="120" width="324" height="420" rx="14" fill="#141221" stroke="#2c2846" stroke-width="4"/>
        <rect x="34" y="140" width="292" height="170" rx="10" fill="#1d1a33"/>
        <circle cx="180" cy="225" r="34" fill="#ff3b6b"/><path d="M170 207 L198 225 L170 243Z" fill="#fff"/>
        <g opacity=".6"><rect x="34" y="320" width="292" height="4" rx="2" fill="#3b3660"/><rect x="34" y="320" width="40" height="4" rx="2" fill="#ff3b6b"/></g>
        <text x="40" y="358" font-family="Montserrat, sans-serif" font-weight="800" font-size="17" fill="#fff">МИФУТКА — ТРЕК (official)</text>
        <circle cx="56" cy="392" r="16" fill="#6a4bb0"/><text x="56" y="398" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#fff">M</text>
        <text x="82" y="389" font-family="Montserrat, sans-serif" font-weight="800" font-size="13" fill="#fff">Мифутка</text>
        <text x="82" y="406" font-family="Montserrat, sans-serif" font-weight="600" font-size="11" fill="#8e88b8">12 подписчиков</text>
        <text x="40" y="440" font-family="Montserrat, sans-serif" font-weight="600" font-size="12" fill="#8e88b8">47 просмотров · 3 года назад</text>
        <rect x="40" y="458" width="84" height="30" rx="15" fill="#2a2645"/><text x="82" y="478" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" fill="#fff">♥ 3</text>
        <rect x="236" y="458" width="84" height="30" rx="15" fill="#ff3b6b"/><text x="278" y="478" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="11" fill="#fff">ПОДПИСАТЬСЯ</text>
        <circle cx="270" cy="250" r="22" fill="#fff" opacity=".0"/>
        <path d="M232 300 l14 34 l6 -12 l12 10 l6 -6 l-12 -10 l12 -6Z" fill="#fff" stroke="#111" stroke-width="2"/>
        </g>
      </g>

      <!-- 5. listening with headphones -->
      <g id="sc-listen" class="scene">
        <rect width="360" height="640" fill="url(#room)"/>
        <circle cx="180" cy="320" r="170" fill="#ff3bd4" opacity=".25" filter="url(#blur)"/>
        <g id="duoListen"></g>
        <g fill="#ffd84d" filter="url(#glow)" font-family="Unbounded, sans-serif" font-weight="900" font-size="30">
          <text class="note" x="70" y="200">♪</text><text class="note b" x="260" y="190">♫</text><text class="note" x="300" y="300" style="animation-delay:.4s">♪</text>
        </g>
      </g>

      <!-- 7. the stairwell -->
      <g id="sc-stairs" class="scene">
        <rect width="360" height="640" fill="url(#stairWall)"/>
        <rect y="430" width="360" height="210" fill="#8c8a84"/>
        <g fill="#7a7872"><rect x="0" y="470" width="200" height="16"/><rect x="0" y="506" width="160" height="16"/><rect x="0" y="542" width="120" height="16"/></g>
        <rect x="250" y="210" width="90" height="230" rx="4" fill="#8a4a26"/><rect x="258" y="218" width="74" height="214" fill="#a35a30"/><circle cx="320" cy="330" r="5" fill="#ffd36b"/>
        <g fill="#f7f7f2"><rect x="40" y="250" width="12" height="90" rx="4"/><rect x="56" y="250" width="12" height="90" rx="4"/><rect x="72" y="250" width="12" height="90" rx="4"/><rect x="88" y="250" width="12" height="90" rx="4"/><rect x="104" y="250" width="12" height="90" rx="4"/><rect x="120" y="250" width="12" height="90" rx="4"/></g>
        <rect y="420" width="360" height="12" fill="#5a3a2a"/>
        <g transform="translate(180 330)">
          <circle class="wave" r="60" fill="none" stroke="#ff3b6b" stroke-width="5"/>
          <circle class="wave b" r="60" fill="none" stroke="#ff3b6b" stroke-width="5"/>
          <rect x="-26" y="-48" width="52" height="96" rx="10" fill="#111"/><rect x="-21" y="-40" width="42" height="78" rx="4" fill="#2a2645"/>
          <circle r="12" fill="#ff3b6b"/><path d="M-4 -7 L8 0 L-4 7Z" fill="#fff"/>
        </g>
        <g fill="#ff3b6b" font-family="Unbounded, sans-serif" font-weight="900" font-size="34">
          <text class="note" x="120" y="300">♪</text><text class="note b" x="220" y="290">♫</text>
        </g>
      </g>
    </g>
    <rect width="360" height="640" fill="url(#vig)" pointer-events="none"/>
  </svg>

  <div class="chip day" id="day">ПН</div>
  <div class="chip mini" id="mini"><i>▶</i>Мифутка — трек</div>
  <div class="chip big" id="big">ЛЮТЫЙ<br>ФЛЕКС</div>
  <div class="subs" id="subs" aria-live="polite"></div>
  <div class="flash" id="flash"></div>

  <div class="start" id="start">
    <h1>МИФУТКА</h1>
    <p>история из клуба ИЗИ · со звуком</p>
    <button id="playBtn" type="button">▶ Смотреть</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('art');
  const set = (k, v) => svg.dataset[k] = v;

  // ---------- characters (generated) ----------
  function face(expr, eyeY) {
    const y = eyeY || 0;
    const eye = (x, d) => expr === 'laugh'
      ? `<path d="M${x - 10} ${y + 2} Q${x} ${y - 9} ${x + 10} ${y + 2}" stroke="#1d1414" stroke-width="3.6" fill="none" stroke-linecap="round"/>`
      : `<ellipse cx="${x}" cy="${y}" rx="${expr === 'shock' ? 12 : 10}" ry="${expr === 'shock' ? 13 : 11}" fill="#fff"/><circle cx="${x + d}" cy="${y + 1}" r="${expr === 'shock' ? 4.5 : 6}" fill="#2a1c16"/><circle cx="${x + d - 2}" cy="${y - 2}" r="2" fill="#fff"/>`;
    const mouth = expr === 'laugh'
      ? `<path d="M-16 36 Q0 58 16 36Z" fill="#7d1f2c"/><path d="M-12 37 h24" stroke="#fff" stroke-width="3"/>`
      : expr === 'shock' ? `<ellipse cx="0" cy="42" rx="8" ry="10" fill="#7d1f2c"/>`
      : `<path d="M-10 40 Q0 46 10 40" stroke="#8a3a3a" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    const brows = expr === 'shock' ? `<path d="M-32 ${y - 22} q12 -8 24 -2 M8 ${y - 24} q12 -6 24 2" stroke="#3a2418" stroke-width="3.6" fill="none" stroke-linecap="round"/>`
      : `<path d="M-32 ${y - 16} q12 -6 24 -1 M8 ${y - 17} q12 -5 24 1" stroke="#3a2418" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
    return `${eye(-21, 1)}${eye(21, -1)}${brows}<path d="M-2 18 q3 6 6 2" stroke="#c98a6c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-34" cy="26" rx="10" ry="6" fill="#ff9a9a" opacity=".35"/><ellipse cx="34" cy="26" rx="10" ry="6" fill="#ff9a9a" opacity=".35"/>${mouth}`;
  }
  // guy in the brown puffer and black cap
  function guyA(expr, phones) {
    return `<g class="bob">
      <path d="M-120 330 C-118 200 -70 150 0 146 C70 150 118 200 120 330Z" fill="url(#puffer)"/>
      <g stroke="#3a2416" stroke-width="3" fill="none" opacity=".7"><path d="M-112 220 Q0 200 112 220"/><path d="M-118 262 Q0 242 118 262"/><path d="M-120 304 Q0 284 120 304"/></g>
      <path d="M-34 150 Q0 176 34 150 L30 132 H-30Z" fill="#5a3a24"/>
      <rect x="-16" y="100" width="32" height="44" fill="#e6ad8a"/>
      <ellipse cx="0" cy="40" rx="52" ry="58" fill="url(#skin)"/>
      <path d="M-50 22 q-4 -14 2 -20 M50 22 q4 -14 -2 -20" stroke="#5a3a24" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0 30)">${face(expr)}</g>
      <path d="M-54 6 C-54 -40 -20 -56 0 -56 C26 -56 56 -40 54 6Z" fill="#111"/>
      <path d="M-54 4 H70 Q66 18 40 16 H-54Z" fill="#000"/>
      <rect x="-24" y="-30" width="48" height="12" rx="3" fill="#fff" opacity=".9"/>
      ${phones ? '<path d="M-60 30 C-60 -70 60 -70 60 30" stroke="#ff3b6b" stroke-width="9" fill="none"/><rect x="-74" y="14" width="22" height="38" rx="9" fill="#ff3b6b"/><rect x="52" y="14" width="22" height="38" rx="9" fill="#ff3b6b"/>' : ''}
    </g>`;
  }
  // curly guy in the black jacket
  function guyB(expr, phones) {
    const curls = [[-46,-14,20],[-30,-40,22],[-4,-52,24],[24,-46,22],[46,-24,20],[54,4,16],[-54,6,16],[-14,-30,18],[14,-28,18]]
      .map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#4a2e1c"/>`).join('');
    return `<g class="bob" style="animation-delay:-1.1s">
      <path d="M-120 330 C-118 200 -70 150 0 146 C70 150 118 200 120 330Z" fill="url(#jacket)"/>
      <path d="M-30 148 L0 200 L30 148Z" fill="#1d2a4a"/>
      <path d="M-40 150 L-6 210 M40 150 L6 210" stroke="#3a3a42" stroke-width="5"/>
      <rect x="-16" y="100" width="32" height="44" fill="#e6ad8a"/>
      <ellipse cx="0" cy="40" rx="52" ry="58" fill="url(#skin)"/>
      ${curls}
      <g transform="translate(0 32)">${face(expr)}</g>
      <circle cx="-30" cy="0" r="14" fill="#4a2e1c"/><circle cx="2" cy="-6" r="15" fill="#4a2e1c"/><circle cx="30" cy="0" r="13" fill="#4a2e1c"/>
      ${phones ? '<path d="M-62 34 C-62 -74 62 -74 62 34" stroke="#22d3ee" stroke-width="9" fill="none"/><rect x="-76" y="18" width="22" height="38" rx="9" fill="#22d3ee"/><rect x="54" y="18" width="22" height="38" rx="9" fill="#22d3ee"/>' : ''}
    </g>`;
  }
  // Mikhail, the evening admin
  function mike() {
    return `<g transform="translate(180 300)"><g class="bob">
      <path d="M-130 340 C-128 200 -76 150 0 146 C76 150 128 200 130 340Z" fill="url(#hoodie)"/>
      <path d="M-46 150 Q0 196 46 150" fill="none" stroke="#2c1d55" stroke-width="10"/>
      <path d="M-20 170 v50 M20 170 v50" stroke="#e8e0ff" stroke-width="4" stroke-linecap="round"/>
      <path d="M-58 130 C-58 170 58 170 58 130" stroke="#111" stroke-width="10" fill="none"/><rect x="-70" y="116" width="24" height="34" rx="10" fill="#111"/><rect x="46" y="116" width="24" height="34" rx="10" fill="#111"/>
      <rect x="-16" y="96" width="32" height="44" fill="#e6ad8a"/>
      <g id="mikeHead">
        <ellipse cx="0" cy="36" rx="54" ry="60" fill="url(#skin)"/>
        <path d="M-56 24 C-60 -30 -20 -44 6 -42 C40 -40 60 -22 56 24 C48 -4 30 -12 4 -10 C-20 -10 -44 0 -56 24Z" fill="#2a1d18"/>
        <g transform="translate(0 30)">${face('calm')}</g>
        <ellipse class="mo" cx="0" cy="72" rx="9" ry="7" fill="#7d1f2c"/>
      </g>
    </g></g>`;
  }
  $('mike').innerHTML = mike();
  $('duoPcs').innerHTML = `<g transform="translate(100 300) scale(.82)">${guyA('calm')}</g><g transform="translate(262 300) scale(.82)">${guyB('calm')}</g>`;
  $('duoListen').innerHTML = `<g class="calm"><g transform="translate(100 250) scale(.85)">${guyA('shock', true)}</g><g transform="translate(262 250) scale(.85)">${guyB('shock', true)}</g></g>
    <g class="laugh"><g transform="translate(100 250) scale(.85)">${guyA('laugh', true)}</g><g transform="translate(262 250) scale(.85)">${guyB('laugh', true)}</g></g>`;

  const VOICE = /*VOICE*/{};
  const WORDS = /*WORDS*/{};
  const MUSIC = /*MUSIC*/"";

  const voices = {};
  for (const k in VOICE) { try { voices[k] = new Audio(VOICE[k]); voices[k].preload = 'auto'; } catch (e) {} }
  let music = null; try { if (MUSIC) { music = new Audio(MUSIC); music.volume = .22; } } catch (e) {}
  let ctx = null;
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  function tone(f0, f1, dur, vol) {
    try { const c = ac(), o = c.createOscillator(), g = c.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, c.currentTime); o.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
      g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur + .02); } catch (e) {}
  }
  function whoosh() {
    try { const c = ac(), n = c.sampleRate * .35, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'bandpass'; f.frequency.setValueAtTime(400, c.currentTime); f.frequency.exponentialRampToValueAtTime(2500, c.currentTime + .35);
      g.gain.value = .05; s.buffer = b; s.connect(f).connect(g).connect(c.destination); s.start(); } catch (e) {}
  }
  const SFX = { pop: () => tone(620, 900, .12, .05), whoosh, ding: () => tone(1320, 1310, 1, .04), snap: () => { whoosh(); tone(2400, 1800, .05, .04); } };

  let timers = [], intervals = [], EVENTS = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const sfx = (ms, name) => { EVENTS.push({ t: ms, type: name }); at(ms, () => SFX[name] && SFX[name]()); };
  const wt = (k, i) => (WORDS[k] && WORDS[k].w[i] ? WORDS[k].w[i][1] * 1000 : 0);

  function scene(name, push, flash) {
    set('scene', name);
    const cam = $('cam');
    cam.style.transition = 'none'; cam.style.transform = `scale(${(push || 1.06) + 0.16}) rotate(${Math.random() < .5 ? -2 : 2}deg)`;
    void cam.getBoundingClientRect();
    cam.style.transition = 'transform .3s cubic-bezier(.2,.9,.3,1)'; cam.style.transform = 'scale(1) rotate(0deg)';
    setTimeout(() => { cam.style.transition = 'transform 4s cubic-bezier(.3,.5,.3,1)'; cam.style.transform = `scale(${push || 1.06})`; }, 320);
    if (flash) { const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  }
  function chip(id, on, text) { const c = $(id); if (text != null) c.innerHTML = text; c.classList.toggle('show', on); }

  function speak(ms, k, who) {
    const w = WORDS[k]; if (!w) return 0;
    EVENTS.push({ t: ms, type: 'voice', k });
    at(ms, () => { const a = voices[k]; if (a) { try { a.currentTime = 0; const p = a.play(); if (p) p.catch(() => {}); } catch (e) {} } if (who) set('talk', who); });
    const chunks = []; for (let i = 0; i < w.w.length; i += 4) chunks.push(w.w.slice(i, i + 4));
    chunks.forEach(ch => {
      at(ms + ch[0][1] * 1000, () => { $('subs').innerHTML = ch.map((x, i) => `<span class="in" style="animation-delay:${i * 40}ms">${x[0]}</span>`).join(' '); });
      ch.forEach((x, j) => at(ms + x[1] * 1000, () => { const sp = $('subs').children; for (let q = 0; q < sp.length; q++) sp[q].classList.toggle('on', q === j); }));
    });
    const end = w.w[w.w.length - 1][2];
    at(ms + end * 1000 + 250, () => { $('subs').innerHTML = ''; });
    return Math.round(w.d * 1000);
  }

  function reset() {
    timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; EVENTS = [];
    for (const k in voices) try { voices[k].pause(); } catch (e) {}
    if (music) { music.pause(); music.currentTime = 0; }
    Object.assign(svg.dataset, { scene: 'street', huh: 'off', nick: 'off', laugh: 'off', mo: '0', talk: '' });
    ['day', 'mini', 'big'].forEach(id => chip(id, false)); $('big').classList.remove('shake');
    $('subs').innerHTML = '';
  }

  function play() {
    reset();
    $('start').hidden = true;
    if (music) { try { const p = music.play(); if (p) p.catch(() => {}); } catch (e) {} }
    EVENTS.push({ t: 0, type: 'music' });
    let t = 300; const G = 180;

    // 1. the club
    at(0, () => scene('street', 1.08));
    t += speak(t, 'a1') + G;

    // 2. the new admin and his nickname
    at(t, () => scene('desk', 1.06));
    sfx(t, 'whoosh');
    const d2 = speak(t, 'a2');
    at(t + wt('a2', 5), () => set('nick', 'on'));
    sfx(t + wt('a2', 5), 'ding');
    t += d2 + G;

    // 3. the two of us find his channel
    at(t, () => { scene('pcs', 1.08); set('nick', 'off'); });
    sfx(t, 'whoosh');
    t += speak(t, 'a3') + G;

    // 4. his track
    at(t, () => scene('screen', 1.18));
    sfx(t, 'pop');
    t += speak(t, 'a4') + 600;

    // 5. we listened... and again... and again (a bit of the real track plays here)
    at(t, () => scene('listen', 1.08, true));
    EVENTS.push({ t, type: 'clip', src: 'c3', from: 3.0, dur: 4.6 });
    const d5 = speak(t, 'a5');
    at(t + wt('a5', 2), () => set('laugh', 'on'));
    t += d5 + 1400;

    // 6. every day, while he isn't looking
    at(t, () => { scene('desk', 1.06); set('laugh', 'off'); });
    sfx(t, 'whoosh');
    const d6 = speak(t, 'a6');
    ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ'].forEach((d, i) => {
      at(t + i * 900, () => { chip('day', true, d); chip('mini', true); set('huh', i % 2 ? 'on' : 'off'); });
      sfx(t + i * 900, 'pop');
    });
    t += Math.max(d6, 4500) + G;
    at(t - 100, () => { chip('day', false); chip('mini', false); set('huh', 'off'); });

    // 7. today: the stairwell
    at(t, () => scene('stairs', 1.06, true));
    sfx(t, 'whoosh');
    t += speak(t, 'a7') + G;

    // 8. LUTYI FLEKS
    at(t, () => { chip('big', true); $('big').classList.add('shake'); const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); });
    sfx(t, 'snap'); sfx(t + 250, 'snap');
    t += speak(t, 'a8') + 500;
    window.__timeline = { total: t, events: EVENTS };
  }

  $('playBtn').addEventListener('click', play);
})();
</script>
</body>
</html>
