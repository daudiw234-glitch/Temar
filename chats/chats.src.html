<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Операция «Таиланд»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Unbounded:wght@800;900&display=swap">
<style>
  /* Layout: a 9:16 phone screen that switches between three chat apps; captions and title cards on top. Single dark look by choice. */
  :root {
    --bg: #0d0b14;
    --f-ui: "Montserrat", system-ui, sans-serif;
    --f-big: "Unbounded", "Montserrat", sans-serif;
    --ai-bg: #16161c; --ai-me: #2f2f3a; --ai-text: #ececf1; --ai-acc: #19c37d;
    --pk-bg: #2a0f22; --pk-me: #ff5ca8; --pk-them: #3d1832; --pk-acc: #ff8cc6;
    --dm-bg: #0f1726; --dm-me: #2f7cf6; --dm-them: #1c2638; --dm-acc: #6aa8ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: #fff; display: grid; place-items: center; overflow: hidden; font-family: var(--f-ui); }
  .frame { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; overflow: hidden; container-type: inline-size; background: #000; }
  .shake { animation: shake .09s linear 5; }
  @keyframes shake { 25% { transform: translate(1.2cqw, -.8cqw); } 50% { transform: translate(-1cqw, 1cqw); } 75% { transform: translate(.8cqw, .8cqw); } }

  /* ---------- apps ---------- */
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .app.on { transform: translateX(0); }
  .app.off { transform: translateX(-100%); }
  .app header { display: flex; align-items: center; gap: 3cqw; padding: 15cqw 5cqw 3.4cqw; border-bottom: .3cqw solid rgba(255,255,255,.08); flex: none; }
  .av { width: 11cqw; height: 11cqw; border-radius: 50%; display: grid; place-items: center; font: 800 4.6cqw var(--f-ui); flex: none; }
  .hd .n { font: 800 4.6cqw var(--f-ui); } .hd .s { font: 600 3cqw var(--f-ui); opacity: .6; margin-top: .4cqw; }
  .feed { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2.2cqw; padding: 4cqw 4cqw 3cqw; overflow: hidden; }
  .bar { flex: none; display: flex; align-items: center; gap: 2.6cqw; padding: 3cqw 4cqw 9cqw; }
  .input { flex: 1; min-height: 11cqw; border-radius: 6cqw; padding: 2.8cqw 4cqw; font: 600 3.8cqw/1.3 var(--f-ui); color: #fff; }
  .input:empty::before { content: attr(data-ph); opacity: .45; }
  .send { width: 11cqw; height: 11cqw; border-radius: 50%; display: grid; place-items: center; font: 900 5cqw var(--f-ui); flex: none; }

  #ai { background: var(--ai-bg); } #ai .av { background: var(--ai-acc); color: #062b1b; } #ai .input { background: #24242e; } #ai .send { background: #ececf1; color: #16161c; }
  #pink { background: radial-gradient(120% 70% at 50% 0%, #4a1638 0%, var(--pk-bg) 60%); } #pink .av { background: linear-gradient(135deg,#ff5ca8,#ff9ed2); color: #3a0a26; }
  #pink .input { background: rgba(255,255,255,.08); } #pink .send { background: var(--pk-me); }
  #dm { background: radial-gradient(120% 70% at 50% 0%, #17284a 0%, var(--dm-bg) 60%); } #dm .av { background: linear-gradient(135deg,#2f7cf6,#7fb4ff); color: #071a3d; }
  #dm .input { background: rgba(255,255,255,.08); } #dm .send { background: var(--dm-me); }

  /* ---------- bubbles ---------- */
  .row { display: flex; flex-direction: column; max-width: 80%; animation: pop .28s cubic-bezier(.3,1.6,.5,1) both; }
  .row.me { align-self: flex-end; align-items: flex-end; } .row.them { align-self: flex-start; }
  @keyframes pop { from { transform: scale(.6) translateY(4cqw); opacity: 0; } }
  .who { font: 800 2.8cqw var(--f-ui); margin: 0 2cqw 1cqw; }
  .b { padding: 2.8cqw 4cqw; border-radius: 5cqw; font: 600 4.1cqw/1.32 var(--f-ui); word-wrap: break-word; }
  #pink .me .b { background: var(--pk-me); border-bottom-right-radius: 1.4cqw; } #pink .them .b { background: var(--pk-them); border-bottom-left-radius: 1.4cqw; }
  #dm .me .b { background: var(--dm-me); border-bottom-right-radius: 1.4cqw; } #dm .them .b { background: var(--dm-them); border-bottom-left-radius: 1.4cqw; }
  #ai .me .b { background: var(--ai-me); } #ai .them { max-width: 92%; } #ai .them .b { background: transparent; padding-left: 0; color: var(--ai-text); }
  .b.caps { font-weight: 900; letter-spacing: .02em; }
  .b.del { font-style: italic; opacity: .55; background: transparent !important; border: .3cqw dashed rgba(255,255,255,.35); }
  .b.rev { display: inline-block; animation: glitch .12s steps(2) infinite; text-shadow: .6cqw 0 #ff2bd6, -.6cqw 0 #2bf0ff; }
  @keyframes glitch { 50% { transform: translateX(.8cqw) skewX(-8deg); filter: hue-rotate(90deg); } }
  .kate .who { color: #ffd1e8; } .fel .who { color: #9fd0ff; } .jam .who { color: #ffc46b; }
  .card { display: flex; align-items: center; gap: 3cqw; padding: 3cqw; border-radius: 4cqw; background: rgba(0,0,0,.35); min-width: 56cqw; }
  .card .pl { width: 10cqw; height: 10cqw; border-radius: 50%; background: #fff; color: #ff5ca8; display: grid; place-items: center; font: 900 4cqw var(--f-ui); flex: none; }
  .card .ti { font: 800 4cqw var(--f-ui); } .card .ar { font: 600 3cqw var(--f-ui); opacity: .7; }
  .wave { display: flex; gap: .6cqw; align-items: center; height: 5cqw; margin-top: 1cqw; } .wave i { width: .8cqw; border-radius: 1cqw; background: #fff; opacity: .8; animation: eq .6s ease-in-out infinite alternate; }
  @keyframes eq { from { height: 1cqw; } to { height: 5cqw; } }
  .typing { display: flex; gap: 1.2cqw; padding: 3.4cqw 4cqw; border-radius: 5cqw; background: rgba(255,255,255,.1); width: max-content; }
  .typing i { width: 1.8cqw; height: 1.8cqw; border-radius: 50%; background: #fff; opacity: .6; animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-1cqw); opacity: 1; } }
  .seen { font: 600 2.6cqw var(--f-ui); opacity: .5; margin: .6cqw 2cqw 0; }

  /* ---------- captions + cards ---------- */
  .chip { position: absolute; left: 50%; top: 4cqw; transform: translateX(-50%); font: 800 3cqw var(--f-ui); letter-spacing: .2cqw; padding: 1.6cqw 3.4cqw; border-radius: 99cqw;
          background: rgba(255,255,255,.12); border: .3cqw solid rgba(255,255,255,.25); white-space: nowrap; z-index: 3; transition: opacity .3s; }
  .cap { position: absolute; left: 6cqw; right: 6cqw; top: 40%; text-align: center; z-index: 6; font: 900 7cqw/1.15 var(--f-big); text-wrap: balance;
         text-shadow: 0 0 3cqw rgba(0,0,0,.9), .5cqw .5cqw 0 #000; transform: scale(.4) rotate(-3deg); opacity: 0; transition: transform .3s cubic-bezier(.3,1.7,.5,1), opacity .2s; pointer-events: none; }
  .cap.show { transform: scale(1) rotate(-3deg); opacity: 1; }
  .cap.y { color: #ffd84d; } .cap.p { color: #ff8cc6; } .cap.g { color: #6dffb3; }
  .title.over { background: linear-gradient(transparent 40%, rgba(11,9,18,.75)); justify-content: flex-start; padding-top: 30cqw; }
  .title { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqw; padding: 8cqw; text-align: center;
           background: radial-gradient(90% 60% at 50% 40%, #2a1240 0%, #0b0912 70%); opacity: 0; transition: opacity .5s; pointer-events: none; }
  .title.show { opacity: 1; }
  .title .h { font: 900 9cqw/1.1 var(--f-big); text-shadow: 0 0 3cqw #ff3bd4; } .title .s { font: 700 4.4cqw/1.35 var(--f-ui); color: #d8cdf0; }
  .title .k { font: 800 3.2cqw var(--f-ui); letter-spacing: .4cqw; color: #ffd84d; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }
  .flash.go { animation: flash .3s ease-out; } @keyframes flash { from { opacity: .85; } to { opacity: 0; } }

  .start { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw; background: rgba(11,9,18,.9); text-align: center; padding: 6cqw; }
  .start[hidden] { display: none !important; }
  .start h1 { font: 900 8cqw/1.15 var(--f-big); margin: 0; } .start p { font: 600 4.2cqw var(--f-ui); margin: 0; color: #c8bfe6; }
  .start button { font: 800 4.4cqw var(--f-ui); background: #ff5ca8; color: #fff; border: 0; padding: 3.4cqw 7cqw; border-radius: 99cqw; cursor: pointer; }
  .start button:focus-visible { outline: .8cqw solid #fff; outline-offset: 1cqw; }
  .narr { position: absolute; left: 6cqw; right: 6cqw; bottom: 27cqw; z-index: 7; text-align: center; font: 800 4.4cqw/1.3 var(--f-ui); color: #ffd84d;
          background: rgba(8,6,14,.82); border: .3cqw solid rgba(255,216,77,.35); padding: 2.6cqw 4cqw; border-radius: 4cqw; text-wrap: balance;
          transform: translateY(3cqw); opacity: 0; transition: opacity .25s, transform .25s; }
  .narr.show { transform: none; opacity: 1; }

  /* ---------- cartoon cutaways ---------- */
  #scn { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; opacity: 0; transform: scale(1.12); transition: opacity .25s, transform .45s cubic-bezier(.2,.8,.3,1); pointer-events: none; }
  #scn.show { opacity: 1; transform: scale(1); }
  #scn .sc { display: none; }
  #scn[data-sc="temar"] #sc-temar, #scn[data-sc="robot"] #sc-robot, #scn[data-sc="kate"] #sc-kate, #scn[data-sc="fel"] #sc-fel,
  #scn[data-sc="colonel"] #sc-colonel, #scn[data-sc="james"] #sc-james, #scn[data-sc="thai"] #sc-thai, #scn[data-sc="bribe"] #sc-bribe, #scn[data-sc="beach"] #sc-beach, #scn[data-sc="walk"] #sc-walk { display: inline; }
  .bobs { animation: bobs 2s ease-in-out infinite; } @keyframes bobs { 50% { transform: translateY(4px); } }
  .typeL { animation: typ .14s ease-in-out infinite alternate; } .typeR { animation: typ .14s ease-in-out infinite alternate-reverse; }
  @keyframes typ { to { transform: translateY(-6px); } }
  .croc { animation: croc 2.4s ease-in-out infinite; } @keyframes croc { 0%, 60%, 100% { transform: translateY(0); } 75% { transform: translateY(-16px); } }
  .rb-broke, .rb-ok2 { display: none; }
  #scn[data-rb="broke"] .rb-ok { display: none; } #scn[data-rb="broke"] .rb-broke { display: inline; }
  #scn[data-rb="fixed"] .rb-bandage { display: inline; } .rb-bandage { display: none; }
  .spark { animation: spark .25s steps(2) infinite; } @keyframes spark { 50% { opacity: 0; } }
  .smoke { animation: smoke 1.6s ease-out infinite; } .smoke.b { animation-delay: .5s; } .smoke.c { animation-delay: 1s; }
  @keyframes smoke { from { transform: translateY(0) scale(.5); opacity: .9; } to { transform: translateY(-90px) scale(1.6); opacity: 0; } }
  .spin { animation: spin .8s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes spin { to { transform: rotate(360deg); } }
  .fly { animation: fly 1.4s ease-in infinite; } .fly.b { animation-delay: .5s; } .fly.c { animation-delay: .9s; }
  @keyframes fly { from { transform: translate(0,0) rotate(0); opacity: 1; } to { transform: translate(-140px,140px) rotate(-40deg); opacity: 0; } }
  .fel-shy { display: none; } #scn[data-fel="shy"] .fel-shy { display: inline; } #scn[data-fel="shy"] .fel-sulk { display: none; }
  .salute { animation: salute .9s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: 10% 90%; } @keyframes salute { from { transform: rotate(60deg); } }
  .plane { animation: plane 6s linear infinite; } @keyframes plane { from { transform: translate(-120px, 40px); } to { transform: translate(480px, -60px); } }
  .sway { animation: sway 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; } @keyframes sway { to { transform: rotate(4deg); } }

  .walkers { animation: walkoff 9s linear forwards; } @keyframes walkoff { from { transform: translate(0,0) scale(1); } to { transform: translate(0,-150px) scale(.35); } }
  .step { animation: stp .5s ease-in-out infinite alternate; } .step.b { animation-delay: -.25s; } @keyframes stp { to { transform: translateY(-5px); } }
  .cash { animation: cash 1.6s ease-in-out infinite; } .cash.b { animation-delay: .5s; } .cash.c { animation-delay: 1s; }
  @keyframes cash { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-30px, 120px) rotate(25deg); opacity: 0; } }
  .heart { animation: heart 2.2s ease-out infinite; } .heart.b { animation-delay: 1.1s; } @keyframes heart { from { transform: translateY(0) scale(.6); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(-80px) scale(1.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .b.rev, .wave i, .typing i { animation: none; } }
</style>
</head>
<body>
<div class="frame" id="frame">
  <section class="app" id="ai">
    <header><div class="av">AI</div><div class="hd"><div class="n">ChatGPT</div><div class="s">помогает начать разговор</div></div></header>
    <div class="feed" id="f-ai"></div>
    <div class="bar"><div class="input" id="in-ai" data-ph="Спросите что-нибудь…"></div><div class="send">↑</div></div>
  </section>
  <section class="app" id="pink">
    <header><div class="av">♥</div><div class="hd"><div class="n">Розовый чат</div><div class="s">Катя, ФЭЛ, Темар, Джамес</div></div></header>
    <div class="feed" id="f-pink"></div>
    <div class="bar"><div class="input" id="in-pink" data-ph="Сообщение"></div><div class="send">➤</div></div>
  </section>
  <section class="app" id="dm">
    <header><div class="av">Ф</div><div class="hd"><div class="n">ФЭЛ</div><div class="s" id="dm-s">был(а) недавно</div></div></header>
    <div class="feed" id="f-dm"></div>
    <div class="bar"><div class="input" id="in-dm" data-ph="Сообщение"></div><div class="send">➤</div></div>
  </section>

  <svg id="scn" viewBox="0 0 360 640" data-sc="" data-rb="ok" data-fel="sulk" aria-hidden="true">
    <defs>
      <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
      <radialGradient id="vg" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
      <radialGradient id="sk" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffdcc4"/><stop offset="1" stop-color="#eab896"/></radialGradient>
      <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7eb3"/><stop offset=".55" stop-color="#ffb36b"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
    </defs>
    <g id="sc-temar" class="sc"></g>
    <g id="sc-robot" class="sc"></g>
    <g id="sc-kate" class="sc"></g>
    <g id="sc-fel" class="sc"></g>
    <g id="sc-colonel" class="sc"></g>
    <g id="sc-james" class="sc"></g>
    <g id="sc-bribe" class="sc"></g>
    <g id="sc-beach" class="sc"></g>
    <g id="sc-walk" class="sc"></g>
    <g id="sc-thai" class="sc"></g>
    <rect width="360" height="640" fill="url(#vg)"/>
  </svg>
  <div class="chip" id="chip">ЧАТ С ИИ</div>
  <div class="cap" id="cap"></div>
  <div class="narr" id="narr"></div>
  <div class="title" id="title"></div>
  <div class="flash" id="flash"></div>

  <div class="start" id="start">
    <h1>Операция «Таиланд»</h1>
    <p>как мы с Джамесом сводили друзей через нейросеть</p>
    <button id="playBtn" type="button">▶ Смотреть</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MUSIC = /*MUSIC*/"";
  const VOICE = /*VOICE*/{};
  const VDUR = /*VDUR*/{};
  const voices = {}; for (const k in VOICE) { try { voices[k] = new Audio(VOICE[k]); } catch (e) {} }
  let music = null; try { if (MUSIC) { music = new Audio(MUSIC); music.volume = .2; } } catch (e) {}

  let timers = [], EVENTS = [], cur = null;
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const ev = (ms, type, extra) => EVENTS.push(Object.assign({ t: ms, type }, extra || {}));
  const rev = s => [...s].reverse().join('');
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

  const CHIPS = { ai: 'ЧАТ С ИИ', pink: 'РОЗОВЫЙ ЧАТ', dm: 'ЛИЧКА С ФЭЛОМ' };
  function app(ms, name) {
    ev(ms, 'whoosh');
    at(ms, () => {
      ['ai', 'pink', 'dm'].forEach(n => { const el = $(n); el.classList.remove('on', 'off'); if (n === name) el.classList.add('on'); else if (cur === n) el.classList.add('off'); });
      cur = name; $('chip').textContent = CHIPS[name];
    });
    return 600;
  }
  function trim(feed) { while (feed.children.length > 9) feed.removeChild(feed.firstElementChild); }
  function bubbleHTML(o) {
    if (o.card) return `<div class="card"><div class="pl">▶</div><div><div class="ti">${o.card}</div><div class="ar">трек · 3:21</div><div class="wave">${'<i></i>'.repeat(14).replace(/<i><\/i>/g, () => `<i style="animation-delay:${(Math.random()*.6).toFixed(2)}s"></i>`)}</div></div></div>`;
    return `<div class="b${o.caps ? ' caps' : ''}">${esc(o.text)}</div>`;
  }
  // my message: typed into the input bar, then sent
  function me(ms, room, text, o = {}) {
    const typeDur = o.card ? 500 : Math.min(2200, 300 + text.length * 32);
    ev(ms, 'keys', { dur: typeDur / 1000 });
    let iv = null;
    at(ms, () => {
      const inp = $('in-' + room); const shown = o.rev ? rev(text) : text; let i = 0;
      iv = setInterval(() => { i += Math.max(1, Math.ceil(shown.length / ((typeDur - 80) / 40))); inp.textContent = o.card ? '♪ ' + o.card : shown.slice(0, i); if (i >= shown.length) clearInterval(iv); }, 40);
    });
    const sendAt = ms + typeDur + 120;
    ev(sendAt, 'sent');
    at(sendAt, () => {
      clearInterval(iv); $('in-' + room).textContent = '';
      const feed = $('f-' + room), row = document.createElement('div');
      row.className = 'row me'; row.innerHTML = bubbleHTML(Object.assign({}, o, { text: o.rev ? rev(text) : text }));
      if (o.id) row.id = o.id;
      feed.appendChild(row); trim(feed);
      if (o.rev) { const b = row.querySelector('.b'); b.classList.add('rev'); setTimeout(() => { b.classList.remove('rev'); b.textContent = text; }, 1300); }
      if (o.caps) { $('frame').classList.remove('shake'); void $('frame').offsetWidth; $('frame').classList.add('shake'); }
    });
    
    return typeDur + 120 + (o.hold || 700) + 100;
  }
  // incoming message: typing dots, then the bubble
  function them(ms, room, who, text, o = {}) {
    const wait = o.wait || 900;
    at(ms, () => { const feed = $('f-' + room), t = document.createElement('div'); t.className = 'row them typing-row'; t.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>'; feed.appendChild(t); trim(feed); });
    at(ms + wait, () => {
      const feed = $('f-' + room); const tr = feed.querySelector('.typing-row'); if (tr) tr.remove();
      const row = document.createElement('div'); row.className = 'row them ' + (who === 'Катя' ? 'kate' : who === 'ФЭЛ' ? 'fel' : who === 'Джамес' ? 'jam' : '');
      row.innerHTML = (room === 'pink' ? `<div class="who">${who}</div>` : '') + `<div class="b${o.caps ? ' caps' : ''}">${esc(text)}</div>`;
      if (o.id) row.id = o.id; feed.appendChild(row); trim(feed);
    });
    ev(ms + wait, 'ping');
    return wait + (o.hold || 900) + 100;
  }
  // AI answer streamed word by word
  function ai(ms, text, o = {}) {
    const words = text.split(' '); const step = o.step || 105;
    at(ms, () => { const feed = $('f-ai'), t = document.createElement('div'); t.className = 'row them typing-row'; t.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>'; feed.appendChild(t); trim(feed); });
    let row;
    at(ms + 700, () => {
      const feed = $('f-ai'); const tr = feed.querySelector('.typing-row'); if (tr) tr.remove();
      row = document.createElement('div'); row.className = 'row them'; row.innerHTML = '<div class="b"></div>'; feed.appendChild(row); trim(feed);
    });
    words.forEach((w, i) => at(ms + 700 + i * step, () => { if (row) row.firstElementChild.textContent = words.slice(0, i + 1).join(' '); }));
    ev(ms + 700, 'stream', { dur: words.length * step / 1000 });
    return 700 + words.length * step + (o.hold || 1200);
  }
  // narrator line: plays the clip and shows it as a caption pill
  function narr(ms, k, text) {
    const d = Math.round((VDUR[k] || 2) * 1000);
    ev(ms, 'voice', { k });

  const felBody = (x, y, sc, mood) => `<g transform="translate(${x} ${y}) scale(${sc})"><g class="bobs">
      <path d="M-120 330 C-118 190 -70 146 0 142 C70 146 118 190 120 330Z" fill="${mood === 'beach' ? '#f2f2f2' : '#5d6470'}"/>
      ${mood === 'beach' ? '' : '<path d="M-74 40 C-80 -60 -40 -96 0 -96 C40 -96 80 -60 74 40 L60 140 H-60Z" fill="#4f5560"/>'}
      <rect x="-16" y="86" width="32" height="44" fill="#e6ad8a"/>
      <ellipse cx="0" cy="22" rx="52" ry="60" fill="url(#sk)"/>
      ${eyes(-21, 21, 18, mood === 'sly' ? 'evil' : 'calm')}
      ${mood === 'sly' ? '<path d="M-16 50 Q0 62 18 46" stroke="#8a3a3a" stroke-width="4" fill="none" stroke-linecap="round"/>'
        : '<path d="M-14 50 Q0 62 14 50" stroke="#8a3a3a" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="-34" cy="36" rx="12" ry="6" fill="#ff8a9a" opacity=".45"/><ellipse cx="34" cy="36" rx="12" ry="6" fill="#ff8a9a" opacity=".45"/>'}
      <path d="M-54 -2 C-56 -50 -20 -64 4 -62 C36 -60 56 -40 54 -4 C40 -26 20 -32 0 -30 C-22 -30 -42 -20 -54 -2Z" fill="#1f1714"/>
    </g></g>`;
  const kateBody = (x, y, sc) => `<g transform="translate(${x} ${y}) scale(${sc})"><g class="bobs" style="animation-delay:-.8s">
      <path d="M-70 20 C-84 -80 -30 -110 0 -110 C40 -110 86 -78 70 20 C78 110 64 170 52 200 L-52 200 C-66 170 -80 110 -70 20Z" fill="#6b4630"/>
      <path d="M-120 330 C-118 190 -70 146 0 142 C70 146 118 190 120 330Z" fill="#ff8cc6"/>
      <rect x="-16" y="86" width="32" height="44" fill="#e6ad8a"/>
      <ellipse cx="0" cy="22" rx="54" ry="62" fill="url(#sk)"/>
      ${eyes(-21, 21, 18, 'calm')}
      <path d="M-12 50 Q0 58 12 50" stroke="#a3404e" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-34" cy="38" rx="12" ry="6" fill="#ff8a9a" opacity=".45"/><ellipse cx="34" cy="38" rx="12" ry="6" fill="#ff8a9a" opacity=".45"/>
      <path d="M-56 0 C-50 -60 -10 -76 10 -72 C44 -66 58 -40 56 -6 C40 -34 14 -40 -6 -38 C-28 -30 -44 -16 -56 0Z" fill="#6b4630"/>
      <path d="M-46 -40 l10 -16 l8 14Z" fill="#ff5ca8"/>
    </g></g>`;
  const coconut = (x, y) => `<g transform="translate(${x} ${y})"><circle r="22" fill="#7a4a24"/><circle r="17" fill="#f4efe2" cx="0" cy="-6"/><path d="M6 -20 L20 -52" stroke="#ff5ca8" stroke-width="4"/></g>`;

  // flashback: Philipp hires Temar and James
  $('sc-bribe').innerHTML = room('#120d16', '#1c1520', '#ffb347') + `
    <path d="M120 0 L240 0 L300 520 L60 520Z" fill="#ffe7a0" opacity=".12"/>
    <rect x="150" y="0" width="60" height="16" fill="#333"/><ellipse cx="180" cy="22" rx="30" ry="10" fill="#ffd36b"/>
    ${temarBody(72, 330, .52)}
    ${jamesBody(288, 330, .52)}
    ${felBody(180, 250, .62, 'sly')}
    <g transform="translate(180 395)"><rect x="-56" y="-30" width="112" height="64" rx="6" fill="#f3e3c3" stroke="#a88a5a" stroke-width="3"/><path d="M-56 -30 L0 6 L56 -30" fill="none" stroke="#a88a5a" stroke-width="3"/>
      <text x="0" y="24" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="10" fill="#7a5a2a">ПЛАН «ТАИЛАНД»</text></g>
    <g fill="#5fbf6a" stroke="#2e7d3a" stroke-width="2">
      <g transform="translate(140 300)"><rect class="cash" x="-20" y="-10" width="40" height="20" rx="3"/></g>
      <g transform="translate(220 290)"><rect class="cash b" x="-20" y="-10" width="40" height="20" rx="3"/></g>
      <g transform="translate(180 280)"><rect class="cash c" x="-20" y="-10" width="40" height="20" rx="3"/></g>
    </g>
    <rect x="70" y="60" width="220" height="40" rx="10" fill="#ffd84d"/><text x="180" y="88" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="18" fill="#1d1420">2 НЕДЕЛИ НАЗАД</text>
    <text x="180" y="140" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="24" fill="#ff8cc6" textLength="300" lengthAdjust="spacingAndGlyphs">ЗАКАЗЧИК: ФИЛИПП</text>`;

  // Thailand: Katya and Philipp on the beach
  $('sc-beach').innerHTML = `<rect width="360" height="640" fill="url(#sunset)"/>
    <circle cx="180" cy="290" r="70" fill="#fff3c4" opacity=".9"/><circle cx="180" cy="290" r="120" fill="#fff3c4" opacity=".35" filter="url(#bl)"/>
    <rect y="350" width="360" height="130" fill="#ff9fb8" opacity=".55"/><path d="M0 372 h360 M40 392 h120 M200 412 h120" stroke="#fff" stroke-width="3" opacity=".5"/>
    <rect y="470" width="360" height="170" fill="#f6d79c"/>
    <g class="sway" transform="translate(30 470)"><path d="M0 0 C6 -80 -4 -160 10 -230" stroke="#6b4630" stroke-width="12" fill="none"/>
      <g fill="#2e8b57" transform="translate(10 -230)"><path d="M0 0 C-40 -20 -80 0 -100 30 C-60 10 -30 10 0 0Z"/><path d="M0 0 C40 -20 80 0 100 30 C60 10 30 10 0 0Z"/><path d="M0 0 C-30 20 -50 50 -60 80 C-30 50 -10 30 0 0Z"/></g></g>
    ${kateBody(118, 360, .7)}
    ${felBody(248, 360, .7, 'beach')}
    ${coconut(70, 560)}${coconut(300, 560)}
    <g fill="#ff3b6b" font-family="Unbounded" font-weight="900" font-size="30"><text class="heart" x="170" y="300">♥</text><text class="heart b" x="196" y="280">♥</text></g>
    <text x="180" y="120" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="30" fill="#fff" style="paint-order:stroke" stroke="#c0306a" stroke-width="6">ТАИЛАНД</text>`;

  // Temar and James walk off into the sunset
  const walker = (x, beanie) => `<g transform="translate(${x} 0)"><g class="step${beanie ? ' b' : ''}">
      <path d="M-26 -10 C-28 -80 -16 -110 0 -112 C16 -110 28 -80 26 -10Z" fill="#2a1236"/>
      <rect x="-20" y="-12" width="14" height="60" rx="6" fill="#2a1236"/><rect x="6" y="-12" width="14" height="60" rx="6" fill="#2a1236"/>
      <circle cy="-132" r="24" fill="#2a1236"/>
      ${beanie ? '<path d="M-24 -136 C-24 -170 24 -170 24 -136Z" fill="#2a1236"/><circle cy="-166" r="8" fill="#2a1236"/>' : ''}
    </g></g>`;
  $('sc-walk').innerHTML = `<rect width="360" height="640" fill="url(#sunset)"/>
    <circle cx="180" cy="330" r="90" fill="#fff3c4"/><circle cx="180" cy="330" r="150" fill="#fff3c4" opacity=".4" filter="url(#bl)"/>
    <rect y="380" width="360" height="260" fill="#f0a35e"/><path d="M180 380 L60 640 H300Z" fill="#f6c27e" opacity=".6"/>
    <g transform="translate(180 590)"><g class="walkers">${walker(-36, false)}${walker(36, true)}
      <ellipse cy="50" rx="90" ry="8" fill="#2a1236" opacity=".25"/></g></g>
    <text x="180" y="120" text-anchor="middle" font-family="Unbounded" font-weight="900" font-size="22" fill="#fff" style="paint-order:stroke" stroke="#c0306a" stroke-width="6" textLength="300" lengthAdjust="spacingAndGlyphs">ОПЕРАЦИЯ ВЫПОЛНЕНА</text>`;

  function cut(ms, name, dur, extra) {
    ev(ms, 'whoosh');
    at(ms, () => { const s = $('scn'); s.dataset.sc = name; Object.assign(s.dataset, extra || {}); s.classList.add('show'); });
    if (dur) at(ms + dur, () => $('scn').classList.remove('show'));
  }

  function reset() {
    timers.forEach(clearTimeout); timers = []; EVENTS = []; cur = null;
    if (music) { music.pause(); music.currentTime = 0; }
    ['ai', 'pink', 'dm'].forEach(n => { $(n).className = 'app'; $('f-' + n).innerHTML = ''; $('in-' + n).textContent = ''; });
    $('cap').className = 'cap'; $('title').className = 'title';
    const sc = $('scn'); sc.classList.remove('show'); Object.assign(sc.dataset, { sc: '', rb: 'ok', fel: 'sulk' });
  }

  function play() {
    reset();
    $('start').hidden = true;
    if (music) { try { const p = music.play(); if (p) p.catch(() => {}); } catch (e) {} }
    ev(0, 'music');
    let t = 200;

    // ---- intro ----
    narr(t + 600, 'j1', 'Катя и Филипп — он же ФЭЛ — расстались из-за его проблем с алкоголем. А зимой они вместе летят в Таиланд. И мы с Джамесом решили их свести.');
    t += title(t, '<div class="k">РЕАЛЬНАЯ ИСТОРИЯ (ПОЧТИ)</div><div class="h">Операция «Таиланд»</div><div class="s">Катя и Филипп (ФЭЛ) расстались<br>из-за его проблем с алкоголем.<br>А зимой — общий Таиланд.</div>', 9600);

    // ---- meet James ----
    cut(t, 'james'); { const d = narr(t, 'j2', 'Джамес — мой напарник. Он отвечает за план. Я — за хаос.'); t += Math.max(d, 3200); at(t - 150, () => $('scn').classList.remove('show')); }

    // ---- the chatbot only gets the conversation started ----
    t += app(t, 'ai');
    t += me(t, 'ai', 'Как начать разговор в чате, чтобы Катя и ФЭЛ снова общались?');
    t += ai(t, 'Начните с общей темы — с поездки в Таиланд. Спокойно и без давления.', { hold: 600 });
    t += narr(t, 'n0', 'Нейросеть помогла только начать разговор. Дальше — мы с Джамесом.');

    // ---- the pink group chat ----
    cut(t, 'temar'); { const d = narr(t, 'v4', 'Розовый чат. Пишу от лица ФЭЛа.'); t += d; at(t - 150, () => $('scn').classList.remove('show')); }
    t += app(t, 'pink');
    t += me(t, 'pink', 'Катя, тебе Фелип хотел сказать', { id: 'p1' });
    t += me(t, 'pink', '', { card: 'Sapphire', id: 'p2', hold: 700 });
    t += them(t, 'pink', 'Джамес', 'Катя, это шедевр, послушай', { wait: 700 });
    t += me(t, 'pink', 'Мои глаза стрельцы Сафир', { id: 'p3' });
    t += them(t, 'pink', 'Катя', 'Не добавляй меня сюда больше', { hold: 500 });
    t += del(t, 'p3');
    t += them(t, 'pink', 'ФЭЛ', 'Иди нахуй', { wait: 600 });
    t += them(t, 'pink', 'Катя', 'пиздец', { wait: 600, hold: 600 });
    cut(t, 'kate'); ev(t + 300, 'del'); { const d = narr(t, 'v5', 'Катя оценила. Удалила всё.'); t += Math.max(d, 2600); at(t - 150, () => $('scn').classList.remove('show')); }

    // ---- DM with FEL ----
    cut(t, 'fel', 0, { fel: 'sulk' }); { const d = narr(t, 'v6', 'Ладно. Иду в личку к ФЭЛу.'); t += Math.max(d, 2400); at(t - 150, () => $('scn').classList.remove('show')); }
    t += app(t, 'dm');
    t += me(t, 'dm', 'Напиши ей. Сейчас.');
    t += them(t, 'dm', 'ФЭЛ', 'Мы не должны сходиться', { wait: 700 });
    t += me(t, 'dm', 'БЛЯ ДАВАЙ Я ЩАС ЧАЙ СЕБЕ СДЕЛАЮ', { caps: true });
    t += me(t, 'dm', 'Моя чашка это пещерная чаша где живут крокодилы и Катя', { hold: 900 });
    t += them(t, 'dm', 'ФЭЛ', 'Ты еблан?', { wait: 600 });
    t += me(t, 'dm', 'А нового её я выстегну');
    cut(t, 'james'); { const d = narr(t, 'j3', 'Джамес тем временем рисовал план. Стрелочки, сердечки, Таиланд.'); t += Math.max(d, 3000); at(t - 150, () => $('scn').classList.remove('show')); }
    t += them(t, 'dm', 'ФЭЛ', '…Или не должны?', { wait: 1100 });
    t += them(t, 'dm', 'ФЭЛ', 'Я хз вообще как себя вести', { hold: 600 });
    cut(t, 'fel', 0, { fel: 'shy' }); ev(t + 400, 'ding'); { const d = narr(t, 'v7', 'Но я-то вижу — он не против. Просто боится.'); t += Math.max(d, 2800); at(t - 150, () => $('scn').classList.remove('show')); }

    // ---- finale in the group ----
    t += app(t, 'pink');
    t += narr(t, 'v9', 'И отправляю шедевр в группу.');
    flash(t);
    t += me(t, 'pink', 'Мы с ФЭЛом меняем города под неоновым дождём', { hold: 900 });
    t += them(t, 'pink', 'Джамес', 'Таиланд зимой. Без драмы, с кокосами', { wait: 700 });
    t += them(t, 'pink', 'Катя', 'я не готова', { wait: 1100, hold: 700 });
    t += me(t, 'pink', 'Принято. Кокосы без давления', { hold: 900 });
    t += app(t, 'dm');
    t += them(t, 'dm', 'ФЭЛ', 'Еблан что ты наделал', { wait: 800, hold: 700 });
    t += me(t, 'dm', 'Я всё правильно сделал, братан', { hold: 1000 });

    // ---- twist: Philipp ordered the whole thing ----
    cut(t, 'bribe'); ev(t + 300, 'ding');
    { const d = narr(t, 'k1', 'А теперь секрет. Весь этот план нам заказал сам Филипп. Он нас подкупил — чтобы мы помогли вернуть Катю.'); t += Math.max(d, 5000); at(t - 150, () => $('scn').classList.remove('show')); }
    t += them(t, 'dm', 'ФЭЛ', '…спасибо, братва', { wait: 1000, hold: 900 });
    t += me(t, 'dm', 'Удачи вам в отношениях, брат. Мы своё сделали', { hold: 1200 });

    // ---- Thailand: Katya and Philipp ----
    cut(t, 'beach'); flash(t);
    { const d = narr(t, 'k2', 'Таиланд. Катя и Филипп. Дальше — уже без нас.'); t += Math.max(d, 3800); }

    // ---- Temar and James walk off into the sunset ----
    cut(t, 'walk');
    { const d = narr(t, 'k3', 'Удачи вам, брат. Мы своё сделали. А мы с Джамесом уходим в закат.'); t += Math.max(d, 4400); }
    t += title(t, '<div class="k">ТЕМАР И ДЖАМЕС</div><div class="h">Операция «Таиланд» выполнена</div><div class="s">пиши в комменты: сойдутся или нет?</div>', 4200, true);
    window.__timeline = { total: t, events: EVENTS };
  }

  $('playBtn').addEventListener('click', play);
})();
