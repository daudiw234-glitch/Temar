<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Масочки из огурчика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
  /* Layout: one 9:16 frame of soft-lit flat vector art; subtitles low-center. Single dark-cinema look by choice. */
  :root {
    --bg: #120d16;
    --sub-hl: #ffd84d;
    --pink: #ff6fa5;
    --f-ui: "Montserrat", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: #fff; display: grid; place-items: center; overflow: hidden; }
  .frame { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; overflow: hidden; container-type: inline-size; background: #000; }
  .frame svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .subs { position: absolute; left: 8cqw; right: 8cqw; top: 128cqw; text-align: center;
          font: 800 5.4cqw/1.28 var(--f-ui); color: #fff; letter-spacing: .01em;
          text-shadow: 0 .3cqw 0 rgba(0,0,0,.55), 0 0 2.4cqw rgba(0,0,0,.6); text-wrap: balance; }
  .subs span { transition: color .08s; }
  .subs span.on { color: var(--sub-hl); }

  .pill { position: absolute; left: 50%; top: 162cqw; transform: translateX(-50%) translateY(3cqw); opacity: 0;
          background: rgba(255,255,255,.14); border: .35cqw solid rgba(255,255,255,.45); backdrop-filter: blur(6px);
          color: #fff; font: 700 3.6cqw var(--f-ui); padding: 2.6cqw 4.6cqw; border-radius: 99cqw; white-space: nowrap;
          transition: opacity .5s, transform .5s cubic-bezier(.2,.8,.3,1); }
  .pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw;
           background: rgba(18,13,22,.82); text-align: center; padding: 6cqw; }
  .start[hidden] { display: none !important; }
  .start h1 { font: 900 8cqw/1.15 var(--f-ui); margin: 0; text-wrap: balance; }
  .start p { font: 600 4.2cqw var(--f-ui); margin: 0; color: #f4cfe0; }
  .start button { font: 800 4.4cqw var(--f-ui); background: var(--pink); color: #fff; border: 0; padding: 3.4cqw 7cqw; border-radius: 99cqw; cursor: pointer; }
  .start button:focus-visible { outline: .8cqw solid #fff; outline-offset: 1cqw; }

  /* ---------- SVG states ---------- */
  .bgs > g, .cast > g { display: none; }
  svg[data-scene="clinic"] #bg-clinic, svg[data-scene="glow"] #bg-glow, svg[data-scene="resto"] #bg-resto,
  svg[data-scene="note"] #bg-note, svg[data-scene="end"] #bg-end { display: inline; }
  svg[data-cast="sveta"] #sveta, svg[data-cast="luda"] #luda, svg[data-cast="phone"] #phone { display: inline; }
  #table { display: none; } svg[data-scene="resto"] #table { display: inline; }
  .eyeR-wink, .l-shock, .l-det, .cukes, .mo, .excl { display: none; }
  svg[data-sface="wink"] .eyeR-open { display: none; } svg[data-sface="wink"] .eyeR-wink { display: inline; }
  svg[data-lface="shock"] .l-norm, svg[data-lface="det"] .l-norm { display: none; }
  svg[data-lface="shock"] .l-shock, svg[data-lface="shock"] .excl, svg[data-lface="det"] .l-det { display: inline; }
  svg[data-cukes="on"] .cukes { display: inline; }
  svg[data-mo="1"][data-talk="sveta"] #sveta .mo, svg[data-mo="1"][data-talk="luda"] #luda .mo { display: inline; }
  svg[data-mo="1"][data-talk="sveta"] #sveta .lips, svg[data-mo="1"][data-talk="luda"] #luda .lmouth { display: none; }
  .chk { opacity: 0; transition: opacity .25s; } .chk.on { opacity: 1; }

  #cam { transform-origin: 180px 320px; }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  .tw { animation: tw 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw.b { animation-delay: 1.1s; }
  @keyframes tw { 50% { opacity: .2; transform: scale(.6); } }
  .dust circle { animation: dust 9s linear infinite; }
  @keyframes dust { from { transform: translateY(20px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
  .excl { animation: pop .3s cubic-bezier(.3,1.7,.5,1); transform-box: fill-box; transform-origin: bottom center; }
  @keyframes pop { from { transform: scale(0); } }
  .flick { animation: flick 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes flick { 50% { transform: scaleY(.85) translateX(1px); } }

  /* before / procedure / after states for Sveta */
  .tired, .towel, .facemask, .brush, .wand { display: none; }
  svg[data-sstate="before"] #sveta .hr { fill: url(#hairDull); }
  svg[data-sstate="before"] #sveta .sk { fill: url(#skinDull); }
  svg[data-sstate="before"] #sveta .dr { fill: #8b8f9c; }
  svg[data-sstate="before"] #sveta .lp { fill: #c98a86; }
  svg[data-sstate="before"] #sveta .shadow, svg[data-sstate="before"] #sveta .spk { display: none; }
  svg[data-sstate="before"] #sveta .tired { display: inline; }
  svg[data-towel="on"] #sveta .hr, svg[data-towel="on"] #sveta .ear, svg[data-towel="on"] #sveta .dr { display: none; }
  svg[data-towel="on"] #sveta .towel { display: inline; }
  svg[data-maskon="on"] #sveta .facemask { display: inline; animation: fadeIn 1.2s ease both; }
  svg[data-brush="on"] #sveta .brush { display: inline; animation: brush 1.1s ease-in-out infinite alternate; }
  svg[data-wand="on"] #sveta .wand { display: inline; animation: wand 2.4s ease-in-out infinite; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: .92; } }
  @keyframes brush { from { transform: translate(0,0); } to { transform: translate(-40px, 18px); } }
  @keyframes wand { 0% { transform: translate(140px, 330px); } 50% { transform: translate(222px, 318px); } 100% { transform: translate(140px, 330px); } }
  svg[data-scene="cabinet"] #bg-cabinet, svg[data-scene="bed"] #bg-bed, svg[data-scene="clock"] #bg-clock, svg[data-scene="mirror"] #bg-mirror { display: inline; }
  svg[data-cast="kosm"] #kosm, svg[data-cast="clock"] #clock { display: inline; }
  #mirrorFrame { display: none; } svg[data-scene="mirror"] #mirrorFrame { display: inline; }
  .mo-k { display: none; } svg[data-mo="1"][data-talk="kosm"] #kosm .mo-k { display: inline; } svg[data-mo="1"][data-talk="kosm"] #kosm .kmouth { display: none; }
  #hMin, #hHour { transform-origin: 180px 320px; }
  svg[data-cast="clock"].spin #hMin { animation: spinM 2.2s cubic-bezier(.5,0,.5,1) forwards; }
  svg[data-cast="clock"].spin #hHour { animation: spinH 2.2s cubic-bezier(.5,0,.5,1) forwards; }
  @keyframes spinM { from { transform: rotate(60deg); } to { transform: rotate(780deg); } }
  @keyframes spinH { from { transform: rotate(35deg); } to { transform: rotate(95deg); } }
  @media (prefers-reduced-motion: reduce) { .bob, .tw, .dust circle, .flick { animation: none; } }
</style>
</head>
<body>
<div class="frame" id="frame">
  <svg class="art" id="art" viewBox="0 0 360 640" data-scene="clinic" data-cast="sveta" data-sface="smile" data-lface="norm" data-cukes="off" data-mo="0" data-talk="" data-sstate="before" data-towel="off" data-maskon="off" data-brush="off" data-wand="off" role="img" aria-label="Мультик: ухоженная героиня выходит от косметолога и встречает подругу в ресторане">
    <defs>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
      <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
      <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
      <linearGradient id="clinicWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9de"/><stop offset="1" stop-color="#d7a9b5"/></linearGradient>
      <linearGradient id="clinicFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98793"/><stop offset="1" stop-color="#7d5160"/></linearGradient>
      <linearGradient id="glowBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset=".6" stop-color="#b56ad6"/><stop offset="1" stop-color="#3b1d5e"/></linearGradient>
      <linearGradient id="restoWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1022"/><stop offset="1" stop-color="#5a2236"/></linearGradient>
      <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a44"/><stop offset="1" stop-color="#2c3b7a"/></linearGradient>
      <linearGradient id="noteBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1236"/><stop offset="1" stop-color="#3c1f45"/></linearGradient>
      <linearGradient id="endBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2e2"/><stop offset="1" stop-color="#e86a9e"/></linearGradient>
      <linearGradient id="hairS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3a2"/><stop offset="1" stop-color="#cc9a48"/></linearGradient>
      <linearGradient id="hairDull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfc3a6"/><stop offset="1" stop-color="#8f8264"/></linearGradient>
      <radialGradient id="skinDull" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ecd6c8"/><stop offset="1" stop-color="#cfae9c"/></radialGradient>
      <linearGradient id="cabWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f6f2"/><stop offset="1" stop-color="#a9d8cc"/></linearGradient>
      <linearGradient id="mintG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6c4"/><stop offset="1" stop-color="#3fa391"/></linearGradient>
      <mask id="faceMask"><ellipse cx="180" cy="296" rx="60" ry="68" fill="#fff"/><ellipse cx="155" cy="296" rx="17" ry="15" fill="#000"/><ellipse cx="205" cy="296" rx="17" ry="15" fill="#000"/><ellipse cx="180" cy="336" rx="18" ry="11" fill="#000"/></mask>
      <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21a07f"/><stop offset="1" stop-color="#11604d"/></linearGradient>
      <radialGradient id="skinS" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe2cf"/><stop offset="1" stop-color="#f1bfa0"/></radialGradient>
      <radialGradient id="skinL" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f7dccb"/><stop offset="1" stop-color="#e2b79e"/></radialGradient>
      <linearGradient id="hairL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c766a"/><stop offset="1" stop-color="#5e4c44"/></linearGradient>
      <linearGradient id="cardi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a77396"/><stop offset="1" stop-color="#6e4363"/></linearGradient>
      <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2550"/><stop offset="1" stop-color="#191533"/></linearGradient>
      <symbol id="spark" viewBox="-10 -10 20 20"><path d="M0 -10 Q1 -1 10 0 Q1 1 0 10 Q-1 1 -10 0 Q-1 -1 0 -10Z" fill="#fff"/></symbol>
    </defs>

    <g id="cam">
      <!-- ===== BACKGROUNDS ===== -->
      <g class="bgs">
        <g id="bg-clinic">
          <rect width="360" height="640" fill="url(#clinicWall)"/>
          <rect y="470" width="360" height="170" fill="url(#clinicFloor)"/>
          <ellipse cx="180" cy="300" rx="130" ry="220" fill="#fff6e8" opacity=".55" filter="url(#blur)"/>
          <rect x="100" y="120" width="160" height="350" rx="10" fill="#fbf3f2"/>
          <rect x="112" y="132" width="136" height="338" rx="6" fill="#efe2e4"/>
          <rect x="124" y="146" width="112" height="150" rx="6" fill="#fff" opacity=".55"/>
          <rect x="128" y="100" width="104" height="30" rx="8" fill="#fff"/>
          <text x="180" y="120" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#b4466f">КОСМЕТОЛОГ</text>
          <ellipse cx="180" cy="490" rx="150" ry="22" fill="#fff6e8" opacity=".35" filter="url(#blurS)"/>
          <g transform="translate(40 410)">
            <path d="M-18 60 L-14 20 H14 L18 60Z" fill="#c77a5a"/>
            <ellipse cx="0" cy="8" rx="34" ry="28" fill="#4e9a6a"/><ellipse cx="-12" cy="-6" rx="18" ry="16" fill="#68b884"/>
          </g>
        </g>

        <g id="bg-glow">
          <rect width="360" height="640" fill="url(#glowBg)"/>
          <circle cx="180" cy="300" r="150" fill="#ffe3f0" opacity=".7" filter="url(#blur)"/>
          <g opacity=".35" fill="#fff">
            <path d="M180 300 L120 -20 L150 -20Z"/><path d="M180 300 L230 -20 L260 -20Z"/><path d="M180 300 L-20 120 L-20 160Z"/><path d="M180 300 L380 140 L380 180Z"/>
          </g>
        </g>

        <g id="bg-resto">
          <rect width="360" height="640" fill="url(#restoWall)"/>
          <rect x="196" y="150" width="140" height="210" rx="6" fill="url(#night)"/>
          <g fill="#ffd36b" opacity=".85"><rect x="214" y="290" width="10" height="12" rx="2"/><rect x="244" y="260" width="10" height="12" rx="2"/><rect x="284" y="300" width="10" height="12" rx="2"/><rect x="310" y="240" width="10" height="12" rx="2"/></g>
          <circle cx="300" cy="196" r="13" fill="#fff6d6"/>
          <rect x="196" y="252" width="140" height="6" fill="#5a2236"/><rect x="263" y="150" width="6" height="210" fill="#5a2236"/>
          <g filter="url(#blurS)" fill="#ffc861">
            <circle cx="30" cy="110" r="9"/><circle cx="90" cy="124" r="8"/><circle cx="150" cy="114" r="10"/><circle cx="210" cy="104" r="8"/><circle cx="270" cy="118" r="9"/><circle cx="330" cy="108" r="8"/>
          </g>
          <g fill="#fff3c4"><circle cx="30" cy="110" r="3"/><circle cx="90" cy="124" r="3"/><circle cx="150" cy="114" r="3"/><circle cx="210" cy="104" r="3"/><circle cx="270" cy="118" r="3"/><circle cx="330" cy="108" r="3"/></g>
          <path d="M0 100 Q90 134 180 108 T360 104" stroke="#1a0812" stroke-width="2" fill="none"/>
          <ellipse cx="80" cy="330" rx="120" ry="160" fill="#ff9a62" opacity=".18" filter="url(#blur)"/>
        </g>

        <g id="bg-note">
          <rect width="360" height="640" fill="url(#noteBg)"/>
          <circle cx="180" cy="300" r="140" fill="#7a4cff" opacity=".35" filter="url(#blur)"/>
        </g>

        <g id="bg-cabinet">
          <rect width="360" height="640" fill="url(#cabWall)"/>
          <circle cx="250" cy="200" r="70" fill="none" stroke="#fff" stroke-width="12" opacity=".9"/>
          <circle cx="250" cy="200" r="90" fill="#fff" opacity=".35" filter="url(#blur)"/>
          <rect x="20" y="230" width="110" height="8" rx="3" fill="#ffffff"/>
          <g><rect x="30" y="196" width="18" height="34" rx="5" fill="#ffc8d9"/><rect x="56" y="204" width="14" height="26" rx="4" fill="#bfe8ff"/><rect x="78" y="190" width="22" height="40" rx="6" fill="#ffe3a3"/><rect x="106" y="206" width="14" height="24" rx="4" fill="#d3c4ff"/></g>
          <rect x="300" y="300" width="40" height="120" rx="8" fill="#ffffff" opacity=".7"/>
          <rect y="520" width="360" height="120" fill="#8fc9bb"/>
        </g>
        <g id="bg-bed">
          <rect width="360" height="640" fill="#cfe9e2"/>
          <ellipse cx="180" cy="250" rx="170" ry="140" fill="#ffffff" opacity=".9"/>
          <ellipse cx="180" cy="220" rx="140" ry="100" fill="#fff" opacity=".8" filter="url(#blur)"/>
          <rect y="430" width="360" height="210" fill="#bfe3d9"/>
        </g>
        <g id="bg-clock">
          <rect width="360" height="640" fill="#2a4f4a"/>
          <circle cx="180" cy="320" r="150" fill="#7fd6c4" opacity=".3" filter="url(#blur)"/>
        </g>
        <g id="bg-mirror">
          <rect width="360" height="640" fill="#f3d9e3"/>
          <circle cx="180" cy="320" r="170" fill="#fff" opacity=".6" filter="url(#blur)"/>
        </g>
        <g id="bg-end">
          <rect width="360" height="640" fill="url(#endBg)"/>
          <circle cx="180" cy="300" r="140" fill="#fff" opacity=".45" filter="url(#blur)"/>
        </g>
      </g>

      <!-- ===== CAST ===== -->
      <g class="cast">
        <!-- Sveta -->
        <g id="sveta"><g class="bob">
          <path d="M92 300 C78 200 126 150 180 150 C238 150 286 198 270 300 C282 380 270 450 256 486 L104 486 C90 450 80 380 92 300Z" class="hr" fill="url(#hairS)"/>
          <path d="M162 340 h36 v54 q-18 12 -36 0Z" fill="#e9b394"/>
          <path class="dr" d="M64 660 C66 510 108 430 180 422 C252 430 294 510 296 660Z" fill="url(#dress)"/>
          <path d="M148 428 Q180 422 212 428 L180 488Z" fill="#efbb9c"/>
          <g fill="#fff8ec"><circle cx="160" cy="440" r="3"/><circle cx="168" cy="447" r="3"/><circle cx="176" cy="451" r="3"/><circle cx="184" cy="451" r="3"/><circle cx="192" cy="447" r="3"/><circle cx="200" cy="440" r="3"/></g>
          <path d="M104 420 C92 480 98 540 112 590 L136 590 C122 530 122 470 134 418Z" class="hr" fill="url(#hairS)"/>
          <path d="M256 420 C268 480 262 540 248 590 L224 590 C238 530 238 470 226 418Z" class="hr" fill="url(#hairS)"/>
          <ellipse class="sk" cx="180" cy="290" rx="64" ry="72" fill="url(#skinS)"/>
          <!-- eyes -->
          <g transform="translate(155 296)">
            <ellipse rx="13" ry="14" fill="#fff"/><circle cx="1" cy="1" r="8.5" fill="#5b3220"/><circle cx="1" cy="1" r="4.2" fill="#160b08"/>
            <circle cx="-2.5" cy="-3" r="2.8" fill="#fff"/><circle cx="3.5" cy="4" r="1.2" fill="#fff"/>
            <path d="M-15 -4 Q0 -18 15 -6" stroke="#2a1212" stroke-width="3.6" fill="none" stroke-linecap="round"/>
            <path d="M-14 -6 l-6 -4 M-12 -9 l-5 -6" stroke="#2a1212" stroke-width="2.4" stroke-linecap="round"/>
            <ellipse class="shadow" cy="-13" rx="14" ry="5" fill="#c86aa8" opacity=".3"/>
          </g>
          <g transform="translate(205 296)">
            <g class="eyeR-open">
              <ellipse rx="13" ry="14" fill="#fff"/><circle cx="-1" cy="1" r="8.5" fill="#5b3220"/><circle cx="-1" cy="1" r="4.2" fill="#160b08"/>
              <circle cx="-4.5" cy="-3" r="2.8" fill="#fff"/><circle cx="1.5" cy="4" r="1.2" fill="#fff"/>
              <path d="M-15 -6 Q0 -18 15 -4" stroke="#2a1212" stroke-width="3.6" fill="none" stroke-linecap="round"/>
              <path d="M14 -6 l6 -4 M12 -9 l5 -6" stroke="#2a1212" stroke-width="2.4" stroke-linecap="round"/>
              <ellipse class="shadow" cy="-13" rx="14" ry="5" fill="#c86aa8" opacity=".3"/>
            </g>
            <g class="eyeR-wink">
              <path d="M-13 0 Q0 8 13 0" stroke="#2a1212" stroke-width="3.6" fill="none" stroke-linecap="round"/>
              <path d="M13 0 l6 -3 M11 3 l5 2" stroke="#2a1212" stroke-width="2.4" stroke-linecap="round"/>
            </g>
          </g>
          <path d="M140 270 Q155 260 170 266 M190 266 Q205 260 220 270" stroke="#a8763c" stroke-width="3.6" fill="none" stroke-linecap="round"/>
          <path d="M178 312 q3 6 6 2" stroke="#d99b7e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <ellipse cx="138" cy="322" rx="14" ry="8" fill="#ff8fa6" opacity=".45"/><ellipse cx="222" cy="322" rx="14" ry="8" fill="#ff8fa6" opacity=".45"/>
          <g class="lips"><path class="lp" d="M166 334 Q173 328 180 332 Q187 328 194 334 Q180 346 166 334Z" fill="#d82a46"/><path d="M172 333 q8 2 14 0" stroke="#ff8a9e" stroke-width="1.6" fill="none"/></g>
          <g class="mo"><ellipse cx="180" cy="336" rx="12" ry="9" fill="#7d1430"/><path d="M170 331 h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M168 333 Q180 324 192 333" stroke="#d82a46" stroke-width="4" fill="none"/></g>
          <circle cx="206" cy="326" r="1.8" fill="#6a2a20"/>
          <path d="M118 286 C112 222 150 194 194 198 C236 202 254 232 248 266 C232 238 206 228 180 234 C160 250 138 266 118 286Z" class="hr" fill="url(#hairS)"/>
          <path d="M170 210 q30 -6 54 14" stroke="#fff4cf" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
          <g class="ear"><circle cx="120" cy="334" r="5" fill="none" stroke="#ffd36b" stroke-width="3"/><circle cx="240" cy="334" r="5" fill="none" stroke="#ffd36b" stroke-width="3"/></g>
          <!-- tired look (before) -->
          <g class="tired">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('art');
  const set = (k, v) => svg.dataset[k] = v;

  const VOICE = /*VOICE*/{};
  const WORDS = /*WORDS*/{};
  const MUSIC = /*MUSIC*/"";

  const voices = {};
  for (const k in VOICE) { try { voices[k] = new Audio(VOICE[k]); voices[k].preload = 'auto'; } catch (e) {} }
  let music = null; try { if (MUSIC) { music = new Audio(MUSIC); music.volume = .22; } } catch (e) {}
  let ctx = null;
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  function tone(f0, f1, dur, vol) {
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, c.currentTime); o.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
      g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur + .02);
    } catch (e) {}
  }
  function whoosh() {
    try {
      const c = ac(), n = c.sampleRate * .35, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'bandpass'; f.frequency.setValueAtTime(400, c.currentTime); f.frequency.exponentialRampToValueAtTime(2500, c.currentTime + .35);
      g.gain.value = .05; s.buffer = b; s.connect(f).connect(g).connect(c.destination); s.start();
    } catch (e) {}
  }
  const SFX = {
    pop: () => tone(620, 900, .12, .05),
    whoosh,
    ding: () => { tone(1320, 1310, 1.1, .04); tone(1980, 1970, .8, .02); },
  };

  let timers = [], intervals = [], EVENTS = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const sfx = (ms, name) => { EVENTS.push({ t: ms, type: name }); at(ms, () => SFX[name] && SFX[name]()); };

  // cut to a scene with a slow push-in, like a camera move
  function scene(name, cast, push) {
    set('scene', name); if (cast) set('cast', cast);
    const cam = $('cam');
    cam.style.transition = 'none'; cam.style.transform = 'scale(1)';
    void cam.getBoundingClientRect();
    cam.style.transition = 'transform 6s cubic-bezier(.2,.6,.3,1)';
    cam.style.transform = `scale(${push || 1.06})`;
  }
  const wt = (k, i) => (WORDS[k] && WORDS[k].w[i] ? WORDS[k].w[i][1] * 1000 : 0);

  // lines without a voice clip are shown as plain captions for a fixed time
  const SILENT = {
    n3: ['Масочки из огурчика. Ну-ну.', 2600],
    f3: ['Всё. Завтра же иду за огурцами!', 2800],
    n4: ['Огурцы не помогут. Записывайся к косметологу — запись в профиле.', 4200],
  };
  function speak(ms, k, who) {
    const w = WORDS[k];
    if (!w) {
      const sl = SILENT[k]; if (!sl) return 0;
      at(ms, () => { $('subs').innerHTML = sl[0].split(' ').map(x => `<span>${x}</span>`).join(' '); });
      at(ms + sl[1] - 200, () => { $('subs').innerHTML = ''; });
      return sl[1];
    }
    EVENTS.push({ t: ms, type: 'voice', k });
    at(ms, () => {
      const a = voices[k]; if (a) { try { a.currentTime = 0; const p = a.play(); if (p) p.catch(() => {}); } catch (e) {} }
      if (who) set('talk', who);
    });
    const chunks = []; for (let i = 0; i < w.w.length; i += 6) chunks.push(w.w.slice(i, i + 6));
    chunks.forEach(ch => {
      at(ms + ch[0][1] * 1000, () => { $('subs').innerHTML = ch.map(x => `<span>${x[0]}</span>`).join(' '); });
      ch.forEach((x, j) => at(ms + x[1] * 1000, () => {
        const sp = $('subs').children; for (let q = 0; q < sp.length; q++) sp[q].classList.toggle('on', q === j);
      }));
    });
    const end = w.w[w.w.length - 1][2];
    if (who) at(ms, () => { const iv = setInterval(() => set('mo', svg.dataset.mo === '1' ? '0' : '1'), 120); intervals.push(iv); at(end * 1000, () => { clearInterval(iv); set('mo', '0'); }); });
    at(ms + end * 1000 + 300, () => { $('subs').innerHTML = ''; });
    return Math.round(w.d * 1000);
  }

  function reset() {
    timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; EVENTS = [];
    for (const k in voices) try { voices[k].pause(); } catch (e) {}
    if (music) { music.pause(); music.currentTime = 0; }
    Object.assign(svg.dataset, { scene: 'clinic', cast: 'sveta', sface: 'smile', lface: 'norm', cukes: 'off', mo: '0', talk: '',
      sstate: 'before', towel: 'off', maskon: 'off', brush: 'off', wand: 'off' });
    svg.classList.remove('spin');
    document.querySelectorAll('.chk').forEach(c => c.classList.remove('on'));
    $('subs').innerHTML = ''; $('pill').classList.remove('show');
  }

  function play() {
    reset();
    $('start').hidden = true;
    if (music) { try { const p = music.play(); if (p) p.catch(() => {}); } catch (e) {} }
    EVENTS.push({ t: 0, type: 'music' });
    let t = 400; const G = 350;

    // 1. before: tired Sveta at the cosmetologist's door
    at(0, () => scene('clinic', 'sveta', 1.05));
    t += speak(t, 'n0') + G;

    // 2. the cosmetologist
    at(t, () => scene('cabinet', 'kosm'));
    sfx(t, 'whoosh');
    t += speak(t, 'k1', 'kosm') + G;

    // 3. the procedure: towel, mask, brush, device
    at(t, () => { scene('bed', 'sveta', 1.1); Object.assign(svg.dataset, { towel: 'on', brush: 'on' }); });
    sfx(t, 'whoosh');
    at(t + 900, () => set('maskon', 'on'));
    at(t + 2600, () => { set('brush', 'off'); set('wand', 'on'); });
    sfx(t + 2600, 'ding');
    const d3 = speak(t, 'n5');
    t += Math.max(d3, 5200) + G;

    // 4. time flies
    at(t, () => { scene('clock', 'clock', 1.04); svg.classList.remove('spin'); void svg.getBoundingClientRect(); svg.classList.add('spin'); });
    sfx(t, 'whoosh');
    t += 2500;

    // 5. done
    at(t, () => { scene('cabinet', 'kosm'); svg.classList.remove('spin'); });
    const d5 = speak(t, 'k2', 'kosm');
    t += (d5 || 1200) + G;

    // 6. the reveal in the mirror
    at(t, () => { scene('mirror', 'sveta', 1.12); Object.assign(svg.dataset, { sstate: 'after', towel: 'off', maskon: 'off', wand: 'off', sface: 'smile' }); });
    sfx(t, 'ding');
    t += speak(t, 'p1', 'sveta') + G;

    // 7. walking out glowing
    at(t, () => scene('clinic', 'sveta', 1.05));
    sfx(t, 'whoosh');
    t += speak(t, 'n1') + G;

    // 8. evening, restaurant
    at(t, () => scene('resto', 'sveta'));
    sfx(t, 'whoosh');
    t += speak(t, 'n2') + G;

    // 9. the friend
    at(t, () => { scene('resto', 'luda'); set('lface', 'shock'); });
    sfx(t, 'pop');
    t += speak(t, 'f1', 'luda') + G;
    at(t, () => set('lface', 'norm'));
    t += speak(t, 'f2', 'luda') + G;

    // 10. the answer: Sveta, her notes app, a wink
    at(t, () => { scene('resto', 'sveta'); set('sface', 'smile'); });
    sfx(t, 'whoosh');
    const d10 = speak(t, 'p2', 'sveta');
    at(t + wt('p2', 4) - 150, () => scene('note', 'phone', 1.08));
    at(t + wt('p2', 4), () => $('c1').classList.add('on'));
    at(t + wt('p2', 6), () => $('c2').classList.add('on'));
    at(t + wt('p2', 8), () => $('c3').classList.add('on'));
    sfx(t + wt('p2', 4), 'pop'); sfx(t + wt('p2', 6), 'pop'); sfx(t + wt('p2', 8), 'pop');
    at(t + d10 - 200, () => { scene('resto', 'sveta'); set('sface', 'wink'); });
    t += d10 + G;

    // 11. narrator's aside
    t += speak(t, 'n3') + G;

    // 12. the friend's cucumber plan
    at(t, () => { scene('resto', 'luda'); set('lface', 'det'); });
    sfx(t, 'whoosh');
    const d12 = speak(t, 'f3', 'luda');
    at(t + Math.max(0, d12 - 500), () => set('cukes', 'on'));
    sfx(t + Math.max(0, d12 - 500), 'pop');
    t += d12 + G + 300;

    // 13. outro
    at(t, () => { scene('end', 'sveta', 1.08); set('sface', 'wink'); set('cukes', 'off'); });
    sfx(t, 'ding');
    const d13 = speak(t, 'n4');
    at(t + Math.max(600, wt('n4', 3)), () => $('pill').classList.add('show'));
    t += d13 + 2400;
    window.__timeline = { total: t, events: EVENTS };
  }

  $('playBtn').addEventListener('click', play);
})();
</script>
</body>
</html>
