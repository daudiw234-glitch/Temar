<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Масочки из огурчика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
  /* Layout: one 9:16 frame of soft-lit flat vector art; subtitles low-center. Single dark-cinema look by choice. */
  :root {
    --bg: #120d16;
    --sub-hl: #ffd84d;
    --pink: #ff6fa5;
    --f-ui: "Montserrat", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: #fff; display: grid; place-items: center; overflow: hidden; }
  .frame { position: relative; height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; overflow: hidden; container-type: inline-size; background: #000; }
  .frame svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .subs { position: absolute; left: 8cqw; right: 8cqw; top: 128cqw; text-align: center;
          font: 800 5.4cqw/1.28 var(--f-ui); color: #fff; letter-spacing: .01em;
          text-shadow: 0 .3cqw 0 rgba(0,0,0,.55), 0 0 2.4cqw rgba(0,0,0,.6); text-wrap: balance; }
  .subs span { transition: color .08s; }
  .subs span.on { color: var(--sub-hl); }

  .pill { position: absolute; left: 50%; top: 150cqw; transform: translateX(-50%) translateY(3cqw); opacity: 0;
          background: rgba(255,255,255,.14); border: .35cqw solid rgba(255,255,255,.45); backdrop-filter: blur(6px);
          color: #fff; font: 700 3.6cqw var(--f-ui); padding: 2.6cqw 4.6cqw; border-radius: 99cqw; white-space: nowrap;
          transition: opacity .5s, transform .5s cubic-bezier(.2,.8,.3,1); }
  .pill.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5cqw;
           background: rgba(18,13,22,.82); text-align: center; padding: 6cqw; }
  .start[hidden] { display: none !important; }
  .start h1 { font: 900 8cqw/1.15 var(--f-ui); margin: 0; text-wrap: balance; }
  .start p { font: 600 4.2cqw var(--f-ui); margin: 0; color: #f4cfe0; }
  .start button { font: 800 4.4cqw var(--f-ui); background: var(--pink); color: #fff; border: 0; padding: 3.4cqw 7cqw; border-radius: 99cqw; cursor: pointer; }
  .start button:focus-visible { outline: .8cqw solid #fff; outline-offset: 1cqw; }

  /* ---------- SVG states ---------- */
  .bgs > g, .cast > g { display: none; }
  svg[data-scene="clinic"] #bg-clinic, svg[data-scene="glow"] #bg-glow, svg[data-scene="resto"] #bg-resto,
  svg[data-scene="note"] #bg-note, svg[data-scene="end"] #bg-end { display: inline; }
  svg[data-cast="sveta"] #sveta, svg[data-cast="luda"] #luda, svg[data-cast="phone"] #phone { display: inline; }
  #table { display: none; } svg[data-scene="resto"] #table { display: inline; }
  .eyeR-wink, .l-shock, .l-det, .cukes, .mo, .excl { display: none; }
  svg[data-sface="wink"] .eyeR-open { display: none; } svg[data-sface="wink"] .eyeR-wink { display: inline; }
  svg[data-lface="shock"] .l-norm, svg[data-lface="det"] .l-norm { display: none; }
  svg[data-lface="shock"] .l-shock, svg[data-lface="shock"] .excl, svg[data-lface="det"] .l-det { display: inline; }
  svg[data-cukes="on"] .cukes { display: inline; }
  svg[data-mo="1"][data-talk="sveta"] #sveta .mo, svg[data-mo="1"][data-talk="luda"] #luda .mo { display: inline; }
  svg[data-mo="1"][data-talk="sveta"] #sveta .lips, svg[data-mo="1"][data-talk="luda"] #luda .lmouth { display: none; }
  .chk { opacity: 0; transition: opacity .25s; } .chk.on { opacity: 1; }

  #cam { transform-origin: 180px 320px; }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(3px); } }
  .tw { animation: tw 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw.b { animation-delay: 1.1s; }
  @keyframes tw { 50% { opacity: .2; transform: scale(.6); } }
  .dust circle { animation: dust 9s linear infinite; }
  @keyframes dust { from { transform: translateY(20px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
  .excl { animation: pop .3s cubic-bezier(.3,1.7,.5,1); transform-box: fill-box; transform-origin: bottom center; }
  @keyframes pop { from { transform: scale(0); } }
  .flick { animation: flick 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes flick { 50% { transform: scaleY(.85) translateX(1px); } }
  @media (prefers-reduced-motion: reduce) { .bob, .tw, .dust circle, .flick { animation: none; } }
</style>
</head>
<body>
<div class="frame" id="frame">
  <svg class="art" id="art" viewBox="0 0 360 640" data-scene="clinic" data-cast="sveta" data-sface="smile" data-lface="norm" data-cukes="off" data-mo="0" data-talk="" role="img" aria-label="Мультик: ухоженная героиня выходит от косметолога и встречает подругу в ресторане">

      <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a44"/><stop offset="1" stop-color="#2c3b7a"/></linearGradient>
      <linearGradient id="noteBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1236"/><stop offset="1" stop-color="#3c1f45"/></linearGradient>
      <linearGradient id="endBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2e2"/><stop offset="1" stop-color="#e86a9e"/></linearGradient>
      <linearGradient id="hairS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6513f"/><stop offset="1" stop-color="#7f2731"/></linearGradient>
      <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21a07f"/><stop offset="1" stop-color="#11604d"/></linearGradient>

      <symbol id="spark" viewBox="-10 -10 20 20"><path d="M0 -10 Q1 -1 10 0 Q1 1 0 10 Q-1 1 -10 0 Q-1 -1 0 -10Z" fill="#fff"/></symbol>

    <g id="cam">

          </g>

        </g></g>

        <!-- phone close-up -->
        <g id="phone">
          <path d="M120 640 C120 560 140 520 168 500 L232 500 C252 520 262 560 262 640Z" fill="#f1bfa0"/>
          <g transform="rotate(-6 180 330)">
            <rect x="96" y="150" width="168" height="340" rx="26" fill="#0e0c1c"/>
            <rect x="104" y="158" width="152" height="324" rx="20" fill="url(#screen)"/>
            <rect x="152" y="166" width="56" height="12" rx="6" fill="#0e0c1c"/>
            <text x="120" y="208" font-family="Montserrat, sans-serif" font-weight="600" font-size="9" fill="#ffd84d">Заметки</text>
            <text x="120" y="232" font-family="Montserrat, sans-serif" font-weight="800" font-size="14" fill="#fff">Секрет молодости</text>
            <g font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#fff">
              <circle cx="128" cy="270" r="8" fill="none" stroke="#9a92c9" stroke-width="2"/><text x="144" y="274">Правильное питание</text>
              <circle cx="128" cy="306" r="8" fill="none" stroke="#9a92c9" stroke-width="2"/><text x="144" y="310">Генетика</text>
              <circle cx="128" cy="342" r="8" fill="none" stroke="#9a92c9" stroke-width="2"/><text x="144" y="346">Масочки из огурчика</text>
            </g>
            <g fill="#4fd38a"><circle class="chk" id="c1" cx="128" cy="270" r="8"/><circle class="chk" id="c2" cx="128" cy="306" r="8"/><circle class="chk" id="c3" cx="128" cy="342" r="8"/></g>
            <text x="120" y="400" font-family="Montserrat, sans-serif" font-weight="600" font-size="9" fill="#8e86b8">* и косметолог по четвергам</text>
          </g>
          <g fill="#f1bfa0"><rect x="244" y="380" width="30" height="18" rx="9" transform="rotate(-12 259 389)"/><rect x="246" y="404" width="30" height="18" rx="9" transform="rotate(-12 261 413)"/></g>
          <g fill="#d82a46"><rect x="262" y="378" width="10" height="12" rx="5" transform="rotate(-12 267 384)"/><rect x="264" y="402" width="10" height="12" rx="5" transform="rotate(-12 269 408)"/></g>
        </g>

      <!-- table with glasses and a candle (restaurant only) -->
      <g id="table">
        <rect y="566" width="360" height="74" fill="#f6efe6"/>
        <rect y="566" width="360" height="6" fill="#fff"/>
        <g opacity=".95">
          <path d="M44 494 q-16 0 -16 28 q0 22 16 24 q16 -2 16 -24 q0 -28 -16 -28Z" fill="#fff" fill-opacity=".25"/>
          <path d="M30 522 q14 6 28 0 q-2 20 -14 22 q-12 -2 -14 -22Z" fill="#8f1438"/>
          <rect x="42" y="546" width="4" height="18" fill="#fff" opacity=".6"/><ellipse cx="44" cy="566" rx="12" ry="3" fill="#fff" opacity=".6"/>
          <path d="M316 494 q-16 0 -16 28 q0 22 16 24 q16 -2 16 -24 q0 -28 -16 -28Z" fill="#fff" fill-opacity=".25"/>
          <path d="M302 522 q14 6 28 0 q-2 20 -14 22 q-12 -2 -14 -22Z" fill="#8f1438"/>
          <rect x="314" y="546" width="4" height="18" fill="#fff" opacity=".6"/><ellipse cx="316" cy="566" rx="12" ry="3" fill="#fff" opacity=".6"/>
        </g>
        <circle cx="96" cy="540" r="30" fill="#ffb347" opacity=".35" filter="url(#blurS)"/>
        <rect x="88" y="544" width="16" height="24" rx="3" fill="#fff3e0"/>
        <path class="flick" d="M96 524 q-7 10 0 18 q7 -8 0 -18Z" fill="#ffc24a"/>
      </g>

      <!-- floating dust + vignette over everything -->
      <g class="dust" fill="#fff" opacity=".5">
        <circle cx="40" cy="520" r="1.6"/><circle cx="90" cy="300" r="1.2" style="animation-delay:-2s"/><circle cx="130" cy="420" r="2" style="animation-delay:-4s"/>
        <circle cx="210" cy="250" r="1.4" style="animation-delay:-1s"/><circle cx="260" cy="480" r="1.8" style="animation-delay:-6s"/><circle cx="310" cy="340" r="1.2" style="animation-delay:-3s"/>
        <circle cx="330" cy="560" r="1.6" style="animation-delay:-5s"/><circle cx="60" cy="200" r="1.3" style="animation-delay:-7s"/><circle cx="180" cy="600" r="1.5" style="animation-delay:-8s"/>
      </g>

  <div class="subs" id="subs" aria-live="polite"></div>
  <div class="pill" id="pill">Запись к косметологу — в профиле ↓</div>

  <div class="start" id="start">
    <h1>Масочки из огурчика</h1>
    <p>мультик · включи звук</p>
    <button id="playBtn" type="button">▶ Смотреть</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const svg = $('art');
  const set = (k, v) => svg.dataset[k] = v;

  const VOICE = /*VOICE*/{};
  const WORDS = /*WORDS*/{};
  const MUSIC = /*MUSIC*/"";

  const voices = {};
  for (const k in VOICE) { try { voices[k] = new Audio(VOICE[k]); voices[k].preload = 'auto'; } catch (e) {} }
  let music = null; try { if (MUSIC) { music = new Audio(MUSIC); music.volume = .22; } } catch (e) {}
  let ctx = null;
  const ac = () => (ctx = ctx || new (window.AudioContext || window.webkitAudioContext)());
  function tone(f0, f1, dur, vol) {
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, c.currentTime); o.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
      g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur + .02);
    } catch (e) {}
  }
  function whoosh() {
    try {
      const c = ac(), n = c.sampleRate * .35, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'bandpass'; f.frequency.setValueAtTime(400, c.currentTime); f.frequency.exponentialRampToValueAtTime(2500, c.currentTime + .35);
      g.gain.value = .05; s.buffer = b; s.connect(f).connect(g).connect(c.destination); s.start();
    } catch (e) {}
  }
  const SFX = {
    pop: () => tone(620, 900, .12, .05),
    whoosh,
    ding: () => { tone(1320, 1310, 1.1, .04); tone(1980, 1970, .8, .02); },
  };

  let timers = [], intervals = [], EVENTS = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const sfx = (ms, name) => { EVENTS.push({ t: ms, type: name }); at(ms, () => SFX[name] && SFX[name]()); };

  // cut to a scene with a slow push-in, like a camera move
  function scene(name, cast, push) {
    set('scene', name); if (cast) set('cast', cast);
    const cam = $('cam');
    cam.style.transition = 'none'; cam.style.transform = 'scale(1)';
    void cam.getBoundingClientRect();
    cam.style.transition = 'transform 6s cubic-bezier(.2,.6,.3,1)';
    cam.style.transform = `scale(${push || 1.06})`;
  }
  const wt = (k, i) => (WORDS[k] && WORDS[k].w[i] ? WORDS[k].w[i][1] * 1000 : 0);

  function speak(ms, k, who) {
    const w = WORDS[k]; if (!w) return 0;
    EVENTS.push({ t: ms, type: 'voice', k });
    at(ms, () => {
      const a = voices[k]; if (a) { try { a.currentTime = 0; const p = a.play(); if (p) p.catch(() => {}); } catch (e) {} }
      if (who) set('talk', who);
    });
    const chunks = []; for (let i = 0; i < w.w.length; i += 6) chunks.push(w.w.slice(i, i + 6));
    chunks.forEach(ch => {
      at(ms + ch[0][1] * 1000, () => { $('subs').innerHTML = ch.map(x => `<span>${x[0]}</span>`).join(' '); });
      ch.forEach((x, j) => at(ms + x[1] * 1000, () => {
        const sp = $('subs').children; for (let q = 0; q < sp.length; q++) sp[q].classList.toggle('on', q === j);
      }));
    });
    const end = w.w[w.w.length - 1][2];
    if (who) at(ms, () => { const iv = setInterval(() => set('mo', svg.dataset.mo === '1' ? '0' : '1'), 120); intervals.push(iv); at(end * 1000, () => { clearInterval(iv); set('mo', '0'); }); });
    at(ms + end * 1000 + 300, () => { $('subs').innerHTML = ''; });
    return Math.round(w.d * 1000);
  }

  function reset() {
    timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers = []; intervals = []; EVENTS = [];
    for (const k in voices) try { voices[k].pause(); } catch (e) {}
    if (music) { music.pause(); music.currentTime = 0; }
    Object.assign(svg.dataset, { scene: 'clinic', cast: 'sveta', sface: 'smile', lface: 'norm', cukes: 'off', mo: '0', talk: '' });
    document.querySelectorAll('.chk').forEach(c => c.classList.remove('on'));
    $('subs').innerHTML = ''; $('pill').classList.remove('show');
  }

  function play() {
    reset();
    $('start').hidden = true;
    if (music) { try { const p = music.play(); if (p) p.catch(() => {}); } catch (e) {} }
    EVENTS.push({ t: 0, type: 'music' });
    let t = 400; const G = 350;

    // 1. leaving the cosmetologist's office
    at(0, () => scene('clinic', 'sveta', 1.05));
    t += speak(t, 'n1') + G;

    // 2. glow-up close-up
    at(t, () => scene('glow', 'sveta', 1.14));
    sfx(t, 'ding');
    t += speak(t, 'p1', 'sveta') + G;

    // 3. evening, restaurant
    at(t, () => scene('resto', 'sveta'));
    sfx(t, 'whoosh');
    t += speak(t, 'n2') + G;

    // 4. the friend
    at(t, () => { scene('resto', 'luda'); set('lface', 'shock'); });
    sfx(t, 'pop');
    t += speak(t, 'f1', 'luda') + G;

    // 5. the question
    at(t, () => set('lface', 'norm'));
    t += speak(t, 'f2', 'luda') + G;

    // 6. the answer: Sveta, then her notes app, then a wink
    at(t, () => { scene('resto', 'sveta'); set('sface', 'smile'); });
    sfx(t, 'whoosh');
    const d6 = speak(t, 'p2', 'sveta');
    at(t + wt('p2', 4) - 150, () => scene('note', 'phone', 1.08));
    at(t + wt('p2', 4), () => $('c1').classList.add('on'));
    at(t + wt('p2', 6), () => $('c2').classList.add('on'));
    at(t + wt('p2', 8), () => $('c3').classList.add('on'));
    sfx(t + wt('p2', 4), 'pop'); sfx(t + wt('p2', 6), 'pop'); sfx(t + wt('p2', 8), 'pop');
    at(t + d6 - 200, () => { scene('resto', 'sveta'); set('sface', 'wink'); });
    t += d6 + G;

    // 7. narrator's aside, Sveta keeps winking
    t += speak(t, 'n3') + G;

    // 8. the friend's cucumber plan
    at(t, () => { scene('resto', 'luda'); set('lface', 'det'); });
    sfx(t, 'whoosh');
    const d8 = speak(t, 'f3', 'luda');
    at(t + d8 - 500, () => set('cukes', 'on'));
    sfx(t + d8 - 500, 'pop');
    t += d8 + G + 300;

    // 9. outro
    at(t, () => { scene('end', 'sveta', 1.08); set('sface', 'wink'); set('cukes', 'off'); });
    sfx(t, 'ding');
    const d9 = speak(t, 'n4');
    at(t + Math.max(600, wt('n4', 3)), () => $('pill').classList.add('show'));
    t += d9 + 2200;
    window.__timeline = { total: t, events: EVENTS };
  }

  $('playBtn').addEventListener('click', play);
})();
</script>
